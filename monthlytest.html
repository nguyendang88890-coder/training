function saveGenQ(idx) {
  const gt = getGenTest(_gtCtx.group, _gtCtx.m);
  if (!gt) return;
  const q = gt.questions[idx];
  const isMCQ = q.type === 'MCQ';

  q.text   = document.getElementById(`eq_text_${idx}`).value.trim();
  q.points = parseFloat(document.getElementById(`eq_pts_${idx}`).value) || 0;
  q.isLiet = document.getElementById(`eq_liet_${idx}`).checked;

  if (isMCQ) {
    q.opts = {
      A: document.getElementById(`eq_optA_${idx}`).value,
      B: document.getElementById(`eq_optB_${idx}`).value,
      C: document.getElementById(`eq_optC_${idx}`).value,
      D: document.getElementById(`eq_optD_${idx}`).value,
    };
    q.correct = document.getElementById(`eq_correct_${idx}`).value;
  } else {
    q.rubric = document.getElementById(`eq_rubric_${idx}`).value.trim();
    const kwRaw = document.getElementById(`eq_kw_${idx}`)?.value || '';
    q.keywords = kwRaw.split(',').map(k => k.trim()).filter(Boolean);
    q.keywordsRequired = Math.max(1, parseInt(document.getElementById(`eq_kwReq_${idx}`)?.value) || q.keywords.length || 1);
  }

  // Recalculate totals
  gt.totalPoints = gt.questions.reduce((s, q) => s + q.points, 0);
  saveGenTest(_gtCtx.group, _gtCtx.m, gt);

  // Optionally propagate fix to the question bank so future tests use the corrected version
  if (document.getElementById(`eq_alsoBank_${idx}`)?.checked) {
    const qb = getQBank(_gtCtx.group);
    if (qb) {
      const bq = qb.questions.find(x => x.id === q.id);
      if (bq) {
        bq.text   = q.text;
        bq.points = q.points;
        bq.isLiet = q.isLiet;
        if (isMCQ) { bq.opts = q.opts; bq.correct = q.correct; }
        else        { bq.rubric = q.rubric; bq.keywords = q.keywords; bq.keywordsRequired = q.keywordsRequired; }
        saveQBank(_gtCtx.group, qb);
      }
    }
  }

  // Re-grade all submitted users and refresh their questionSnapshots
  const regraded = regradeAllSubmissions(_gtCtx.group, _gtCtx.m, gt);

  // Re-render this question card
  const el = document.getElementById(`pqi_${idx}`);
  el.outerHTML = buildPreviewQHTML(q, idx, _gtCtx.group, _gtCtx.m);

  // Update header info
  const infoEl = document.getElementById('previewModalInfo');
  if (infoEl) infoEl.textContent = `${fmtMonth(_gtCtx.m)} · ${gt.mcqCount} MCQ${gt.essayCount?' + '+gt.essayCount+' Essay':''} · ${gt.totalPoints}pts total · Last edited: just now${regraded?' · ✅ Re-graded '+regraded+' submission'+(regraded>1?'s':''):''}`;
}

function regradeAllSubmissions(group, month, updatedGT) {
  const cfg        = getMC()[month] || {};
  const passOthers = cfg.passOthers ?? 70;
  const isBDCSG    = group === 'bdcs';
  const ms         = getMS();
  let count = 0;

  Object.entries(getUsersDB()).forEach(([un, ud]) => {
    if (isBDCS(ud) !== isBDCSG) return;          // only matching group
    const sub = getSubmission(un, month);
    if (!sub || !sub.submittedAt || !sub.mcqResults) return;

    // Re-calculate mcqScore + lietWrong from updated correct answers / points
    let mcqScore = 0, lietWrong = 0;
    updatedGT.questions.forEach(q => {
      if (q.type !== 'MCQ') return;
      const res = sub.mcqResults[q.id];
      if (!res) return;
      const correct = !!(res.ans && q.correct && res.ans.toUpperCase() === q.correct.toUpperCase());
      res.correct = correct;
      if (correct) mcqScore += q.points;
      else if (q.isLiet) lietWrong++;
    });

    sub.mcqScore  = mcqScore;
    sub.lietWrong = lietWrong;

    // Refresh questionSnapshot so review page shows updated text/options/correct
    if (sub.questionSnapshot) {
      updatedGT.questions.forEach(q => {
        if (!sub.questionSnapshot[q.id]) return;
        sub.questionSnapshot[q.id] = {
          text: q.text, type: q.type, isLiet: !!q.isLiet, points: q.points,
          ...(q.type === 'MCQ' ? { opts: q.opts, correct: q.correct } : {}),
          ...(q.rubric         ? { rubric: q.rubric }                  : {})
        };
      });
    }

    // Others: update provisionalPassed + auto-graded monthly_scores entry
    if (!isBDCSG) {
      sub.provisionalPassed = mcqScore >= passOthers;
      if (!ms[month]) ms[month] = {};
      const sc = ms[month][un];
      if (!sc || sc.autoGraded) {
        ms[month][un] = {
          score: mcqScore, passed: sub.provisionalPassed,
          autoGraded: true, gradedAt: new Date().toISOString()
        };
      }
    }

    saveSubmission(un, month, sub);
    count++;
  });

  if (!isBDCSG && count) saveMS(ms);   // one write for all Others scores
  return count;
}

function buildExportRows(list, month, isBDCSGroup) {
  const scores  = getMS()[month] || {};
  const cfg     = getMC()[month] || {};
  const passOth = cfg.passOthers ?? 70;
  const passBDCS= cfg.passBDCS   ?? 250;
  const lietMax = cfg.lietMax    ?? 10;

  const fmtT = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const fmtDur = (s, e) => {
    if (!s || !e) return '';
    const m = Math.round((new Date(e)-new Date(s))/60000);
    return m < 60 ? m+'m' : Math.floor(m/60)+'h '+(m%60)+'m';
  };

  const hdr = isBDCSGroup
    ? ['Full Name','Work Name','Username','Department','Position','New/Existed','Submitted','Start','Submit','Duration','Score (/300)','Liet Wrong','Pass/Fail','Graded At']
    : ['Full Name','Work Name','Username','Department','Position','New/Existed','Submitted','Start','Submit','Duration','Score (/100)','Pass/Fail','Graded At'];

  const rows = list.map(([un, ud]) => {
    const sc  = scores[un];
    const sub = getSubmission(un, month);
    const empType = ud.employeeType==='new' ? 'New' : ud.employeeType==='old' ? 'Existed' : '';

    // Score: monthly_scores first, then submission fallback for Others
    let score = '', passText = '', gradedAt = '';
    if (sc && sc.score != null) {
      score    = sc.score;
      gradedAt = fmtDT(sc.gradedAt);
      if (isBDCSGroup) {
        const liet = sc.liet ?? 0;
        passText = sc.score >= passBDCS && liet <= lietMax ? 'PASS' : 'FAIL';
      } else {
        passText = (sc.passed != null ? sc.passed : sc.score >= passOth) ? 'PASS' : 'FAIL';
      }
    } else if (!isBDCSGroup && sub?.mcqScore != null) {
      // Others: use submission auto-score as fallback when monthly_scores not yet written
      score    = sub.mcqScore;
      passText = sub.mcqScore >= passOth ? 'PASS' : 'FAIL';
      gradedAt = fmtDT(sub.submittedAt);
    }

    const subStatus = sub?.submittedAt ? 'Submitted' : 'Not Submitted';
    const base = [
      ud.fullName||'', ud.workName||'', un, ud.department||'', ud.position||'', empType,
      subStatus, fmtT(sub?.startedAt), fmtT(sub?.submittedAt), fmtDur(sub?.startedAt, sub?.submittedAt),
      score
    ];
    if (isBDCSGroup) base.push(sc?.liet ?? '');
    base.push(passText, gradedAt);
    return base;
  });
  return [hdr, ...rows];
}

function exportGroup(month, group) {
  const trainees = Object.entries(getUsersDB()).filter(([,u]) => u.role !== 'admin' && u.role !== 'mod');
  const isBDCSG  = group === 'bdcs';
  const list     = isBDCSG ? trainees.filter(([,u]) => isBDCS(u)) : trainees.filter(([,u]) => !isBDCS(u));
  const sheetName = isBDCSG ? 'BD & CS' : 'Other Departments';
  doExport([buildExportRows(list, month, isBDCSG)], [sheetName], `Monthly_${month}_${sheetName.replace(/ /g,'_')}`);
}

function exportAll() {
  const month = document.getElementById('scMonth')?.value; if (!month) return;
  const trainees = Object.entries(getUsersDB()).filter(([,u]) => u.role !== 'admin' && u.role !== 'mod');
  const bdcs   = trainees.filter(([,u]) => isBDCS(u));
  const others = trainees.filter(([,u]) => !isBDCS(u));
  doExport([buildExportRows(bdcs,month,true), buildExportRows(others,month,false)], ['BD & CS','Other Departments'], `Monthly_Test_${month}_All`);
}

function doExport(sheetsData, sheetNames, filename) {
  if (typeof XLSX!=='undefined') {
    const wb=XLSX.utils.book_new();
    sheetsData.forEach((data,i)=>{
      const ws=XLSX.utils.aoa_to_sheet(data);
      ws['!cols']=data[0].map((_,ci)=>({wch:Math.max(...data.map(r=>String(r[ci]||'').length),12)}));
      XLSX.utils.book_append_sheet(wb,ws,sheetNames[i]);
    });
    XLSX.writeFile(wb,filename+'.xlsx');
  } else {
    const csv=sheetsData[0].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download=filename+'.csv'; a.click();
  }
}

  if (!sel) return;
  const all=Object.entries(getUsersDB()).filter(([,u])=>u.role!=='admin');
  const filtered=q
    ? all.filter(([u,d])=>
        u.toLowerCase().includes(q)||
        (d.email||'').toLowerCase().includes(q)||
        (d.fullName||'').toLowerCase().includes(q)||
        (d.workName||'').toLowerCase().includes(q))
    : all;
  if (countEl) countEl.textContent=q?`${filtered.length} result${filtered.length!==1?'s':''}`:'' ;
  sel.innerHTML=filtered.length
    ? filtered.map(([u,d])=>`<option value="${u}">${u}${d.fullName?' — '+d.fullName:''}${d.email?' · '+d.email:''}</option>`).join('')
    : `<option value="">— No match —</option>`;
  renderHistTable();
}

function renderHistTable() {
  const uname=document.getElementById('histSel').value;
  const el=document.getElementById('histTableWrap');
  if (!uname) { el.innerHTML=`<div style="color:var(--text-muted);padding:16px;">No trainee selected.</div>`; return; }
  const scores=getMS(), cfgs=getMC();
  const months=Object.keys(cfgs).sort();
  const udata=getUsersDB()[uname]||{};
  const userIsBDCS=isBDCS(udata);
  const maxScore=userIsBDCS?300:100;
  let fc=0;
  const rows=months.map(m=>{
    const sc=scores[m]?.[uname], cfg=cfgs[m], rs=getRS(uname)[m];
    const sub=getSubmission(uname,m);
    if (sc&&!sc.passed) fc++;
    return {m,sc,cfg,rs,fc,sub};
  });
  if (!rows.some(r=>r.sc||r.sub)) {
    el.innerHTML=`<div style="color:var(--text-muted);padding:16px;">No test records for this trainee yet.</div>`; return;
  }
  const lietCol=userIsBDCS?'<th>Liet Score</th>':'';
  el.innerHTML=`<div class="hist-wrap"><table>
    <thead><tr><th>Month</th><th>Test Period</th><th>Score (/${maxScore})</th>${lietCol}<th>Result</th><th>Failed Count</th><th>Rescheduled</th><th>Action</th></tr></thead>
    <tbody>
      ${rows.filter(r=>r.sc||r.sub).map(({m,sc,cfg,rs,fc,sub})=>{
        const pfCls=sc?(sc.passed?'pf-badge pass':'pf-badge fail'):'pf-badge none';
        const rsTxt=rs?(rs.status==='approved'?`✓ ${fmtDT(rs.rsStart)}`:rs.status==='rejected'?'✗ Rejected':'⏳ Pending'):'—';
        const startD=userIsBDCS?cfg?.startDateBDCS:cfg?.startDateOthers;
        const endD  =userIsBDCS?cfg?.deadlineBDCS :cfg?.deadlineOthers;
        const lietCell=userIsBDCS?`<td style="text-align:center">${sc?.liet??'—'}</td>`:'';
        const subInfo=sub?.submittedAt?`<div style="font-size:0.7rem;color:var(--text-muted);margin-top:3px;">Submitted ${fmtDT(sub.submittedAt)}</div>`:'';
        const hasSub=!!(sub?.submittedAt);
        return `<tr>
          <td style="font-weight:700;color:var(--gold)">${fmtMonth(m)}</td>
          <td style="font-size:0.78rem;color:var(--text-muted)">${cfg?fmtDT(startD)+' →<br>'+fmtDT(endD):'—'}</td>
          <td style="font-size:1.05rem;font-weight:700">${sc?sc.score:(hasSub?'<span style="color:var(--text-muted);font-size:0.8rem;">Pending</span>':'—')}</td>
          ${lietCell}
          <td><span class="${pfCls}">${sc?(sc.passed?'✓ PASS':'✗ FAIL'):(hasSub?'<span style="color:var(--text-muted);font-size:0.78rem;">Pending grade</span>':'—')}</span>${subInfo}</td>
          <td style="color:${fc>0?'var(--danger)':'var(--success)'};font-weight:600;">${sc?fc:'—'}</td>
          <td style="font-size:0.8rem;color:var(--text-secondary)">${rsTxt}</td>
          <td>${hasSub?`<button class="btn-xs del" onclick="deleteSubmission('${uname}','${m}')" title="Delete this submission so the user can retake the test">🗑 Delete</button>`:'—'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
}

function deleteSubmission(un, month) {
  const sub = getSubmission(un, month);
  if (!sub) { alert('No submission found.'); return; }
  const confirmed = confirm(
    `Delete ${un}'s submission for ${fmtMonth(month)}?\n\n` +
    `Submitted: ${fmtDT(sub.submittedAt)}\n` +
    `This will also remove their score for this month.\n\n` +
    `The user will be able to retake the test.`
  );
  if (!confirmed) return;

  // Remove from localStorage
  localStorage.removeItem(`wmt_sub_${un}_${month}`);

  // Remove from Firebase
  if (window.FDB) FDB.ref(`submissions/${un}/${month}`).remove().catch(() => {});

  // Remove score from monthly_scores
  const ms = getMS();
  if (ms[month]?.[un]) {
    delete ms[month][un];
    saveMS(ms);
  }

  renderHistTable();
  renderScoresTables();
}

// ===== RESCHEDULE TAB =====
function updateRsBadge() {
  let n=0;
  Object.keys(getUsersDB()).forEach(u=>{ Object.values(getRS(u)).forEach(r=>{ if(r.status==='pending') n++; }); });
  const b=document.getElementById('rsBadge');
  if (b) { b.textContent=n; b.classList.toggle('hidden',n===0); }
}

function renderRescheduleTab() {
  const users=getUsersDB(), allReqs=[];
  Object.entries(users).forEach(([un,ud])=>{
    Object.entries(getRS(un)).forEach(([m,req])=>{ allReqs.push({un,ud,m,req}); });
  });

  const el=document.getElementById('adminRescheduleTab');
  if (!allReqs.length) { el.innerHTML=`<div class="empty-state">No reschedule requests.</div>`; return; }

  // Build month list (newest first) for the filter dropdown
  const allMonths = [...new Set(allReqs.map(r=>r.m))].sort().reverse();

  // Read current filter from a data attr on the element (persists across re-renders)
  const curMonth = el.dataset.rsMonth || 'all';
  const curStatus = el.dataset.rsStatus || 'all';

  // Filter
  let reqs = allReqs.filter(r =>
    (curMonth  === 'all' || r.m         === curMonth) &&
    (curStatus === 'all' || r.req.status === curStatus)
  );

  // Sort within each group: warning (approved-no-deadline) first, then pending → approved → rejected
  reqs.sort((a,b)=>{
    if (a.m !== b.m) return b.m.localeCompare(a.m); // newest month first
    const aWarn = a.req.status==='approved' && !a.req.rsDeadline ? -1 : 0;
    const bWarn = b.req.status==='approved' && !b.req.rsDeadline ? -1 : 0;
    if (aWarn !== bWarn) return aWarn - bWarn;
    return ({pending:0,approved:1,rejected:2}[a.req.status]??9)-({pending:0,approved:1,rejected:2}[b.req.status]??9);
  });

  // Counts for badge
  const pendingTotal = allReqs.filter(r=>r.req.status==='pending').length;
  const missingDeadline = allReqs.filter(r=>r.req.status==='approved'&&!r.req.rsDeadline);

  const stB=s=>s==='approved'?`<span class="pf-badge pass">✓ Approved</span>`:s==='rejected'?`<span class="pf-badge fail">✗ Rejected</span>`:`<span class="pf-badge none">⏳ Pending</span>`;

  // Warning banner
  const warningBanner = missingDeadline.length
    ? `<div style="margin-bottom:12px;padding:10px 16px;background:rgba(255,61,113,0.08);border:1px solid rgba(255,61,113,0.3);border-radius:8px;font-size:0.84rem;color:var(--danger);">
        ⚠️ <strong>${missingDeadline.length} request</strong> approved nhưng <strong>chưa có deadline</strong> — user không thể vào thi. Bấm <strong>"⚠️ Set Deadline"</strong> để mở cửa sổ thi.
       </div>`
    : '';

  // Filter bar
  const monthOptions = `<option value="all">All months (${allReqs.length})</option>`
    + allMonths.map(m=>{
        const cnt = allReqs.filter(r=>r.m===m).length;
        const pend = allReqs.filter(r=>r.m===m&&r.req.status==='pending').length;
        return `<option value="${m}" ${m===curMonth?'selected':''}>${fmtMonth(m)} — ${cnt} request${cnt!==1?'s':''}${pend?` (${pend} pending)`:''}`;
      }).join('');

  const statusOptions = `
    <option value="all" ${curStatus==='all'?'selected':''}>All statuses</option>
    <option value="pending"  ${curStatus==='pending' ?'selected':''}>⏳ Pending</option>
    <option value="approved" ${curStatus==='approved'?'selected':''}>✓ Approved</option>
    <option value="rejected" ${curStatus==='rejected'?'selected':''}>✗ Rejected</option>`;

  const filterBar = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <select onchange="document.getElementById('adminRescheduleTab').dataset.rsMonth=this.value;renderRescheduleTab()"
        style="padding:7px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:0.83rem;cursor:pointer;">
        ${monthOptions}
      </select>
      <select onchange="document.getElementById('adminRescheduleTab').dataset.rsStatus=this.value;renderRescheduleTab()"
        style="padding:7px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:0.83rem;cursor:pointer;">
        ${statusOptions}
      </select>
      <span style="font-size:0.8rem;color:var(--text-muted);">Showing <strong>${reqs.length}</strong> of <strong>${allReqs.length}</strong> requests</span>
    </div>`;

  // Build cards — group by month when "All months" is selected
  let cardsHTML = '';
  if (curMonth === 'all') {
    // Group by month
    const byMonth = {};
    reqs.forEach(r=>{ (byMonth[r.m] = byMonth[r.m]||[]).push(r); });
    const months = Object.keys(byMonth).sort().reverse();
    cardsHTML = months.map(m => {
      const group = byMonth[m];
      const pend  = group.filter(r=>r.req.status==='pending').length;
      const warn  = group.filter(r=>r.req.status==='approved'&&!r.req.rsDeadline).length;
      const badge = pend  ? `<span style="background:rgba(255,168,0,0.18);color:var(--warning);border:1px solid rgba(255,168,0,0.35);padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:700;">${pend} pending</span>` : '';
      const warnB = warn  ? `<span style="background:rgba(255,61,113,0.12);color:var(--danger);border:1px solid rgba(255,61,113,0.3);padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:700;">⚠️ ${warn} no deadline</span>` : '';
      return `
        <div style="margin-bottom:24px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">
            <span style="font-size:1rem;font-weight:800;color:var(--text-primary);">📅 ${fmtMonth(m)}</span>
            <span style="font-size:0.78rem;color:var(--text-muted);">${group.length} request${group.length!==1?'s':''}</span>
            ${badge}${warnB}
          </div>
          ${group.map(r=>buildRsCard(r,stB)).join('')}
        </div>`;
    }).join('');
  } else {
    cardsHTML = reqs.length
      ? reqs.map(r=>buildRsCard(r,stB)).join('')
      : `<div class="empty-state">No requests match this filter.</div>`;
  }

  el.innerHTML = warningBanner + filterBar + cardsHTML;
}

function buildRsCard({un,ud,m,req}, stB) {
  return `
    <div class="rsched-item" style="${req.status==='approved'&&!req.rsDeadline?'border-color:rgba(255,61,113,0.4);':''}">
      <div class="rsched-hdr">
        <div>
          <span style="font-weight:700;color:var(--text-primary)">${un}</span>
          ${ud.fullName?`<span style="color:var(--text-muted);font-size:0.82rem"> — ${ud.fullName}</span>`:''}
          <span style="color:var(--gold);font-size:0.82rem;margin-left:8px;">${fmtMonth(m)}</span>
        </div>
        ${stB(req.status)}
      </div>
      <div style="font-size:0.82rem;color:var(--text-secondary);line-height:1.9;">
        Requested: <strong>${fmtDT(req.rsStart||req.newDate+'T'+(req.newTime||'09:00'))}</strong> &nbsp;·&nbsp; Submitted: ${fmtDT(req.requestedAt)}
        ${req.rsDeadline?`<br>Approved window: <strong>${fmtDT(req.rsStart||req.newDate+'T'+(req.newTime||'09:00'))}</strong> → <strong>${fmtDT(req.rsDeadline)}</strong>`:''}
        ${req.reason?`<br>Reason: ${req.reason}`:''}
        ${req.rejectReason?`<br><span style="color:var(--danger)">Rejection note: ${req.rejectReason}</span>`:''}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        ${req.status==='pending'?`
          <button class="btn-xs app" onclick="approveRs('${un}','${m}')">✓ Approve</button>
          <button class="btn-xs rej" onclick="rejectRs('${un}','${m}')">✗ Reject</button>`:''}
        ${req.status==='approved'?`
          <button class="btn-xs app" onclick="approveRs('${un}','${m}')"
            style="background:rgba(0,214,143,0.12);border-color:var(--success);"
            title="${req.rsDeadline?'Chỉnh sửa deadline đã approve':'⚠️ Deadline chưa được đặt — cần set ngay để mở test cho user'}">
            ${req.rsDeadline?'✏️ Edit Deadline':'⚠️ Set Deadline'}
          </button>`:''}
        <button class="btn-xs" onclick="resetRs('${un}','${m}')"
          style="background:transparent;border:1px solid var(--border);color:var(--text-muted);"
          title="Xoá request này — user có thể gửi lại request mới">↩ Reset</button>
      </div>
    </div>`;
}

function approveRs(un, m) {
  const rs = getRS(un); if (!rs[m]) return;
  const req = rs[m];

  document.getElementById('approveRsModal')?.remove();
  const modal = document.createElement('div');
  modal.id = 'approveRsModal';
  modal.className = 'modal-overlay show';
  modal.innerHTML = `<div class="modal-box" style="max-width:420px;">
    <h3 style="margin-bottom:8px;">✓ Approve Reschedule</h3>
    <div style="font-size:0.84rem;color:var(--text-muted);margin-bottom:16px;">
      <strong>${un}</strong> — ${fmtMonth(m)}<br>
      Trainee requested: <strong>${fmtDT(req.rsStart||req.newDate+'T'+(req.newTime||'09:00'))}</strong>
    </div>
    <div class="form-group">
      <label>Test Opens At <span style="font-weight:400;color:var(--text-muted)">(in your local timezone)</span></label>
      <input type="text" id="rsApproveStart" value="${fmtDT(req.rsStart||req.newDate+'T'+(req.newTime||'09:00'))}" disabled
        style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-muted);font-size:0.88rem;width:100%;box-sizing:border-box;">
    </div>
    <div class="form-group">
      <label>Test Deadline *</label>
      <input type="datetime-local" id="rsApproveDeadline"
        style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-primary);font-size:0.88rem;width:100%;box-sizing:border-box;">
      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">Gợi ý: thêm 2–4 giờ sau giờ bắt đầu để trainee có đủ thời gian làm bài.</div>
    </div>
    <div class="error-msg" id="rsApproveErr"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('approveRsModal').remove()">Cancel</button>
      <button class="btn btn-success" onclick="confirmApproveRs('${un}','${m}')">✓ Confirm Approve</button>
    </div>
  </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);

  // Pre-fill deadline = requested start + 3 hours (sensible default for admin)
  try {
    const startMs = new Date(req.rsStart || `${req.newDate}T${req.newTime||'09:00'}`).getTime();
    const suggested = new Date(startMs + 3 * 60 * 60 * 1000); // +3 h
    const pad = n => String(n).padStart(2, '0');
    const dlVal = `${suggested.getFullYear()}-${pad(suggested.getMonth()+1)}-${pad(suggested.getDate())}T${pad(suggested.getHours())}:${pad(suggested.getMinutes())}`;
    document.getElementById('rsApproveDeadline').value = dlVal;
  } catch(e) { /* ignore */ }
}

function confirmApproveRs(un, m) {
  const deadline = document.getElementById('rsApproveDeadline').value;
  const err = document.getElementById('rsApproveErr');
  err.textContent = '';
  if (!deadline) { err.textContent = 'Please set a deadline.'; return; }
  const rs = getRS(un); if (!rs[m]) return;
  const start = rs[m].rsStart || new Date(`${rs[m].newDate}T${rs[m].newTime||'09:00'}`).toISOString();
  if (new Date(deadline) <= new Date(start)) { err.textContent = 'Deadline must be after the start time.'; return; }
  rs[m].status = 'approved';
  rs[m].rsDeadline = new Date(deadline).toISOString(); // store as UTC ISO
  rs[m].processedAt = new Date().toISOString();
  saveRS(un, rs);
  document.getElementById('approveRsModal').remove();
  updateRsBadge(); renderRescheduleTab();
}
function rejectRs(un,m) {
  const note=prompt('Rejection note (optional):')||'';
  const rs=getRS(un); if(!rs[m]) return;
  rs[m].status='rejected'; rs[m].processedAt=new Date().toISOString();
  if (note.trim()) rs[m].rejectReason=note.trim();
  saveRS(un,rs); updateRsBadge(); renderRescheduleTab();
}

function resetRs(un, m) {
  const ud = getUsersDB()[un];
  const name = ud?.fullName || un;
  if (!confirm(`Xoá request reschedule tháng ${fmtMonth(m)} của "${name}"?\n\nSau khi reset, user có thể gửi lại request mới cho tháng này.`)) return;
  const rs = getRS(un);
  delete rs[m];
  // If no more months left, remove the whole key; otherwise save the trimmed object
  if (Object.keys(rs).length === 0) {
    dbRemove('wmt_monthly_reschedule_' + un);
  } else {
    saveRS(un, rs);
  }
  updateRsBadge();
  renderRescheduleTab();
}

function findActiveOrUpcoming() {
  const cfgs=getMC(), months=Object.keys(cfgs).sort().reverse();
  const now=Date.now();
  const userRS=getRS(CUR_USER);

  // 1. User has an approved reschedule whose personal window is CURRENTLY OPEN
  //    → must check first, before global schedule, so that an upcoming global
  //      test for a new month doesn't shadow the user's active personal window
  //      from a previous expired month.
  for (const m of months) {
    const rs=userRS[m];
    if (rs?.status==='approved' && rs.rsDeadline) {
      const rsStartTs = rs.rsStart ? new Date(rs.rsStart).getTime() : 0;
      const rsEndTs   = new Date(rs.rsDeadline).getTime();
      if (now >= rsStartTs && now <= rsEndTs) return {cfg:cfgs[m],m};
    }
  }

  // 2. Global active or upcoming test
  for (const m of months) {
    const st=getStatus(cfgs[m]);
    if (st==='active'||st==='upcoming') return {cfg:cfgs[m],m};
  }

  // 3. User has an approved reschedule whose personal window is upcoming (not started yet)
  for (const m of months) {
    const rs=userRS[m];
    if (rs?.status==='approved' && rs.rsDeadline && now<=new Date(rs.rsDeadline).getTime()) {
      return {cfg:cfgs[m],m};
    }
  }

  // 4. Fallback: most recent month
  if (months.length) return {cfg:cfgs[months[0]],m:months[0]};
  return {cfg:null,m:null};
}

function startCountdown(target) {
  function tick() {
    const diff=target-Date.now(), box=document.getElementById('cdBox');
    if (!box) { clearInterval(_cdTimer); return; }
    if (diff<=0) { clearInterval(_cdTimer); renderTraineeView(); return; }
    const vals=[[Math.floor(diff/86400000),'Days'],[Math.floor(diff%86400000/3600000),'Hrs'],[Math.floor(diff%3600000/60000),'Min'],[Math.floor(diff%60000/1000),'Sec']];
    box.innerHTML=vals.map(([v,l])=>`<div class="cd-unit"><div class="cd-num">${String(v).padStart(2,'0')}</div><div class="cd-lbl">${l}</div></div>`).join('');
  }
  tick(); _cdTimer=setInterval(tick,1000);
}

function submitReschedule(m, minDate, maxDate) {
  const date=document.getElementById('rsDate').value,
        time=document.getElementById('rsTime').value||'09:00',
        reason=document.getElementById('rsReason').value.trim(),
        err=document.getElementById('rsErr');
  err.textContent='';
  if (!date) { err.textContent='Please select a new date.'; return; }
  if (date<minDate||date>maxDate) { err.textContent=`Date must be within ${fmtMonth(m)}.`; return; }
  const rs=getRS(CUR_USER);
  const rsStart = new Date(`${date}T${time}`).toISOString(); // store as UTC ISO
  rs[m]={ rsStart, newDate:date, newTime:time, reason, requestedAt:new Date().toISOString(), status:'pending', processedAt:null };
  saveRS(CUR_USER,rs);
  renderTraineeReschedule();
}

      ${rows.filter(r=>r.sc||r.cfg).map(({m,sc,cfg,rs,fc})=>{
        const pfCls=sc?(sc.passed?'pf-badge pass':'pf-badge fail'):'pf-badge none';
        const rsTxt=rs?(rs.status==='approved'?`✓ ${fmtDT(rs.rsStart)}`:rs.status==='rejected'?'✗ Rejected':'⏳ Pending'):'—';
        const startD=userIsBDCSH?cfg?.startDateBDCS:cfg?.startDateOthers;
        const endD  =userIsBDCSH?cfg?.deadlineBDCS :cfg?.deadlineOthers;
        const lietTd=userIsBDCSH?`<td style="text-align:center;color:${sc?.liet>0?'var(--danger)':'var(--text-muted)'}">${sc?.liet??'—'}</td>`:'';
        const driveTd = cfg?.driveLink
          ? `<td><a href="${cfg.driveLink}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:600;color:#ff7096;text-decoration:none;padding:4px 10px;background:rgba(255,61,113,0.08);border:1px solid rgba(255,61,113,0.25);border-radius:6px;" onmouseover="this.style.background='rgba(255,61,113,0.16)'" onmouseout="this.style.background='rgba(255,61,113,0.08)'">📤 Submit</a></td>`
          : `<td style="color:var(--text-muted);font-size:0.78rem;">—</td>`;
        return `<tr>
          <td style="font-weight:700;color:var(--gold)">${fmtMonth(m)}</td>
          <td style="font-size:0.78rem;color:var(--text-muted)">${cfg?fmtDT(startD)+' →<br>'+fmtDT(endD):'—'}</td>
          <td style="font-size:1.1rem;font-weight:800;color:${sc?'var(--text-primary)':'var(--text-muted)'}">${sc?sc.score:'—'}</td>
          ${lietTd}
          <td><span class="${pfCls}">${sc?(sc.passed?'✓ PASS':'✗ FAIL'):'—'}</span></td>
          <td style="color:${fc>0?'var(--danger)':'var(--success)'};font-weight:700;">${sc?fc:'—'}</td>
          <td style="font-size:0.8rem;color:var(--text-secondary)">${rsTxt}</td>
          ${driveTd}
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
}
</script>
</body>
</html>
