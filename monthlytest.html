<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Test | WMT Training</title>
<link rel="stylesheet" href="style.css">
<style>
.mt-hero {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 28px 32px; margin-bottom: 24px; position: relative; overflow: hidden;
}
.mt-hero::before {
  content: ''; position: absolute; top:-40px; right:-40px; width:200px; height:200px;
  background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%); pointer-events:none;
}
.mt-status {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
}
.mt-status.upcoming { background: rgba(100,150,255,0.15); color: #6496ff; }
.mt-status.active   { background: rgba(0,214,143,0.15); color: var(--success); animation: mtpulse 2s infinite; }
.mt-status.expired  { background: rgba(255,61,113,0.1); color: var(--danger); }
.mt-status.none     { background: rgba(90,90,120,0.18); color: var(--text-muted); }
@keyframes mtpulse { 0%,100%{opacity:1} 50%{opacity:.65} }

.mt-title { font-size: 1.25rem; font-weight: 700; color: var(--gold); margin-bottom: 14px; }
.mt-meta  { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 14px; margin-top: 14px; }
.mt-meta-item .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.mt-meta-item .val { font-size: 0.88rem; color: var(--text-primary); font-weight: 500; }

.countdown { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.cd-unit { background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.15); border-radius: 10px; padding: 10px 16px; text-align: center; min-width: 58px; }
.cd-num  { font-size: 1.5rem; font-weight: 800; color: var(--gold); line-height: 1; }
.cd-lbl  { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }

.test-link-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px;
  background: linear-gradient(135deg, var(--gold), #FFA500); color: #0a0a16; font-weight: 800;
  font-size: 0.95rem; border-radius: 10px; text-decoration: none; margin-top: 18px;
  transition: opacity .2s, transform .1s; border: none; cursor: pointer;
}
.test-link-btn:hover { opacity: .88; transform: translateY(-1px); color: #0a0a16; }
.test-link-btn.locked { background: rgba(255,255,255,0.07); color: var(--text-muted); cursor: not-allowed; transform: none; pointer-events: none; }

/* Reschedule */
.reschedule-card { background: rgba(100,150,255,0.05); border: 1px solid rgba(100,150,255,0.2); border-radius: 12px; padding: 22px; margin-bottom: 24px; }
.reschedule-card h4 { color: #6496ff; margin-bottom: 12px; font-size: 1rem; }

/* Config */
.config-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 26px; margin-bottom: 24px; }
.config-card h4 { color: var(--gold); margin-bottom: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width:600px) { .form-row { grid-template-columns: 1fr; } }

.test-cfg-row {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px;
  margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.test-cfg-month { font-weight: 700; color: var(--gold); }
.test-cfg-info  { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

/* Scores table */
.score-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 28px; }
.score-section-hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.score-section-hdr-left { display: flex; align-items: center; gap: 10px; }
.score-section-icon { font-size: 1.4rem; }
.score-section-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
.score-section-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
.score-section-bdcs .score-section-hdr { background: rgba(100,150,255,0.05); border-bottom-color: rgba(100,150,255,0.2); }
.score-section-bdcs .score-section-title { color: #6496ff; }
.score-section-others .score-section-hdr { background: rgba(255,215,0,0.04); border-bottom-color: rgba(255,215,0,0.15); }
.score-section-others .score-section-title { color: var(--gold); }
.score-section-body { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 340px); }
.score-section-body table { min-width: 680px; font-size: 0.84rem; width: 100%; }
.score-section-body thead th { background: var(--bg-secondary); padding: 10px 13px; text-align: left; white-space: nowrap; font-size: 0.78rem; color: var(--text-muted); position: sticky; top: 0; z-index: 2; }
.score-section-body tbody td { padding: 10px 13px; vertical-align: middle; border-top: 1px solid var(--border); }
.score-section-body::-webkit-scrollbar { height: 6px; width: 6px; }
.score-section-body::-webkit-scrollbar-track { background: transparent; }
.score-section-body::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 3px; }
.score-section-body::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.5); }
.score-section-body::-webkit-scrollbar-corner { background: transparent; }
.score-section-empty { padding: 24px 20px; color: var(--text-muted); font-size: 0.84rem; text-align: center; }

.score-inp { width: 68px; padding: 5px 8px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 0.85rem; text-align: center; }
.score-inp:focus { outline: none; border-color: var(--gold); }

.pf-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
.pf-badge.pass { background: rgba(0,214,143,0.15); color: var(--success); }
.pf-badge.fail { background: rgba(255,61,113,0.12); color: var(--danger); }
.pf-badge.none { background: rgba(90,90,120,0.15); color: var(--text-muted); }

/* History */
.hist-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 295px); }
.hist-wrap table { min-width: 580px; font-size: 0.84rem; width: 100%; }
.hist-wrap thead th { background: var(--bg-secondary); padding: 11px 14px; text-align: left; position: sticky; top: 0; z-index: 2; }
.hist-wrap tbody td { padding: 10px 14px; vertical-align: middle; border-top: 1px solid var(--border); }
.hist-wrap::-webkit-scrollbar { height: 6px; width: 6px; }
.hist-wrap::-webkit-scrollbar-track { background: transparent; }
.hist-wrap::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 3px; }
.hist-wrap::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.5); }
.hist-wrap::-webkit-scrollbar-corner { background: transparent; }

/* Reschedule request cards */
.rsched-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
.rsched-hdr  { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }

/* Export + inline action btns */
.export-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; border: 1px solid; cursor: pointer; transition: all .15s; }
.export-btn.xl  { background: rgba(0,214,143,0.08); border-color: rgba(0,214,143,0.35); color: var(--success); }
.export-btn.xl:hover { background: rgba(0,214,143,0.18); }
.btn-xs { padding: 4px 11px; font-size: 0.74rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all .15s; white-space: nowrap; }
.btn-xs.ok  { background: rgba(0,214,143,0.1); border-color: rgba(0,214,143,0.4); color: var(--success); }
.btn-xs.ok:hover  { background: rgba(0,214,143,0.2); }
.btn-xs.del { background: rgba(255,61,113,0.1); border-color: rgba(255,61,113,0.4); color: var(--danger); }
.btn-xs.del:hover { background: rgba(255,61,113,0.2); }
.btn-xs.edi { background: rgba(255,215,0,0.08); border-color: rgba(255,215,0,0.3); color: var(--gold); }
.btn-xs.edi:hover { background: rgba(255,215,0,0.16); }
.btn-xs.app { background: rgba(0,214,143,0.1); border-color: rgba(0,214,143,0.4); color: var(--success); }
.btn-xs.app:hover { background: rgba(0,214,143,0.2); }
.btn-xs.rej { background: rgba(255,61,113,0.1); border-color: rgba(255,61,113,0.4); color: var(--danger); }
.btn-xs.rej:hover { background: rgba(255,61,113,0.2); }
.btn-danger  { background: rgba(255,61,113,0.15); border: 1px solid rgba(255,61,113,0.4); color: var(--danger); border-radius: 8px; cursor: pointer; font-weight: 700; transition: background .15s; }
.btn-danger:hover { background: rgba(255,61,113,0.25); }

.month-sel, .trainee-sel {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
  padding: 8px 14px; border-radius: 8px; font-size: 0.88rem;
}
.month-sel:focus, .trainee-sel:focus { outline: none; border-color: var(--gold); }
.empty-state { text-align:center; padding: 40px 24px; color: var(--text-muted); }

/* AI Essay Grading */
.essay-score-row { display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px; }
.essay-score-inp { width:70px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text-primary);font-size:0.88rem;text-align:center; }
.essay-ai-btn { padding:4px 12px;font-size:0.78rem;background:rgba(100,150,255,0.12);border:1px solid rgba(100,150,255,0.3);color:#6496ff;border-radius:6px;cursor:pointer;font-weight:600;transition:background .15s; }
.essay-ai-btn:hover:not(:disabled) { background:rgba(100,150,255,0.22); }
.essay-ai-btn:disabled { opacity:0.5;cursor:not-allowed; }
.essay-ai-feedback { margin-top:8px;font-size:0.78rem;background:rgba(0,214,143,0.05);border:1px solid rgba(0,214,143,0.2);border-radius:6px;padding:8px 10px;color:var(--text-secondary);line-height:1.5; }
.essay-ai-feedback.err { background:rgba(255,61,113,0.05);border-color:rgba(255,61,113,0.2);color:var(--danger); }

/* Question Bank */
.qbank-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
.qbank-card-hdr { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.qbank-card-hdr h4 { margin: 0; font-size: 0.9rem; }
.qbank-card-bdcs h4 { color: #6496ff; }
.qbank-card-others h4 { color: var(--gold); }
.qbank-card-body { padding: 18px 20px; }
.upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 14px; }
.upload-zone:hover { border-color: var(--gold); background: rgba(255,215,0,0.03); }
.qbank-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.qbank-stat { background: var(--bg-secondary); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; color: var(--text-secondary); }
.qbank-stat strong { color: var(--gold); }
.qbank-preview { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.qbank-q-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
.qbank-q-row:last-child { border-bottom: none; }
.qbank-q-num { font-weight: 700; color: var(--text-muted); min-width: 22px; }
.qbank-q-text { flex: 1; color: var(--text-secondary); }
.qbank-tag { border-radius: 4px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
.qbank-tag.essay { background: rgba(100,150,255,0.12); color: #6496ff; }
.qbank-tag.liet  { background: rgba(255,61,113,0.1); color: var(--danger); }
.qbank-tag.mcq   { background: rgba(255,215,0,0.08); color: var(--gold); }
.qbank-tag.pts   { background: rgba(90,90,120,0.15); color: var(--text-muted); }

/* Test Preview Modal */
.preview-q-wrap { padding: 0; }
.preview-q-item { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.preview-q-item:last-child { border-bottom: none; }
.preview-q-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.preview-q-num { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); min-width: 26px; }
.preview-q-type-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.preview-q-type-mcq   { background: rgba(255,215,0,0.1); color: var(--gold); }
.preview-q-type-essay { background: rgba(100,150,255,0.12); color: #6496ff; }
.preview-q-liet  { background: rgba(255,61,113,0.1); color: var(--danger); font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.preview-q-pts   { background: rgba(90,90,120,0.15); color: var(--text-muted); font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.preview-q-text { font-size: 0.9rem; color: var(--text-primary); line-height: 1.55; margin-bottom: 10px; }
.preview-q-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.preview-q-opt  { display: flex; align-items: flex-start; gap: 8px; font-size: 0.84rem; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); }
.preview-q-opt.correct { background: rgba(0,214,143,0.08); border-color: rgba(0,214,143,0.4); color: var(--success); font-weight: 600; }
.preview-q-opt-lbl { font-weight: 700; min-width: 18px; }
.preview-q-rubric { font-size: 0.78rem; color: var(--text-muted); background: rgba(100,150,255,0.05); border-radius: 7px; padding: 8px 12px; line-height: 1.5; }

/* OBS Recording */
.obs-callout {
  background: rgba(255,61,113,0.06); border: 1px solid rgba(255,61,113,0.28);
  border-radius: 12px; padding: 16px 20px; margin-top: 18px;
  display: flex; align-items: flex-start; gap: 14px;
}
.obs-callout-icon { font-size: 1.7rem; flex-shrink: 0; line-height: 1; }
.obs-callout-body { flex: 1; }
.obs-callout-title { font-weight: 700; color: var(--danger); font-size: 0.9rem; margin-bottom: 4px; }
.obs-callout-text  { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.65; }
.obs-submit-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
  background: linear-gradient(135deg, #ff3d71, #b0004e); color: #fff; font-weight: 700;
  font-size: 0.88rem; border-radius: 10px; text-decoration: none; margin-top: 12px;
  transition: opacity .2s, transform .1s; border: none; cursor: pointer;
}
.obs-submit-btn:hover { opacity: .85; transform: translateY(-1px); color: #fff; }

/* ===== NOTIFICATION BELL ===== */
.notif-bell-wrap { position: relative; margin-left: auto; }
.notif-bell-btn {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 7px 12px; color: var(--text-secondary); cursor: pointer;
  font-size: 1rem; display: flex; align-items: center; gap: 6px; transition: all .18s;
  position: relative;
}
.notif-bell-btn:hover { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.3); color: var(--gold); }
.notif-bell-btn.active { background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.4); color: var(--gold); }
.notif-badge {
  position: absolute; top: -6px; right: -6px;
  background: var(--danger); color: #fff; font-size: 0.62rem; font-weight: 800;
  min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center;
  justify-content: center; padding: 0 4px; border: 2px solid var(--bg-primary);
  pointer-events: none;
}
/* Notification Panel */
.notif-panel {
  position: fixed; top: 60px; right: 16px; width: 320px; max-height: 80vh;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 300;
  overflow-y: auto; animation: slideInRight .18s ease;
}
.notif-panel.hidden { display: none; }
@keyframes slideInRight { from { opacity:0; transform: translateX(12px); } to { opacity:1; transform: none; } }
.notif-tz-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: rgba(100,150,255,0.07); border: 1px solid rgba(100,150,255,0.2);
  border-radius: 8px; margin-bottom: 14px; font-size: 0.78rem; color: var(--text-secondary); }
.notif-section-hdr { font-size: 0.7rem; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.notif-test-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.notif-test-row:last-child { border-bottom: none; }
.notif-test-month { font-weight: 700; color: var(--gold); font-size: 0.88rem; }
.notif-test-time  { font-size: 0.79rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.7; }
.notif-check-row  { display: flex; align-items: center; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
.notif-check-row:last-child { border-bottom: none; }
.notif-check-label { font-size: 0.82rem; color: var(--text-secondary); }
.notif-enable-btn {
  width: 100%; margin-top: 14px; padding: 12px;
  background: linear-gradient(135deg,#FFD700,#FFA500); color: #0a0a16;
  font-weight: 800; border: none; border-radius: 10px; cursor: pointer; font-size: 0.88rem;
  transition: opacity .18s;
}
.notif-enable-btn:hover { opacity: .88; }
.notif-status-msg { font-size: 0.8rem; padding: 10px 0; text-align: center; }
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="top-bar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="top-bar-title">Monthly Test</span>
      <div class="notif-bell-wrap" id="notifBellWrap" style="display:none;">
        <button class="notif-bell-btn" id="notifBell" onclick="toggleNotifPanel()" title="Test Schedule Notifications">
          🔔
          <span class="notif-badge hidden" id="notifBadge">0</span>
        </button>
      </div>
    </div>
    <!-- Notification Panel -->
    <div class="notif-panel hidden" id="notifPanel"></div>

    <div class="page-content animate-in">

      <!-- ===== ADMIN VIEW ===== -->
      <div id="adminView" class="hidden">
        <div class="page-tabs">
          <button class="page-tab active" id="tabSetup"      onclick="switchAdminTab('Setup')">⚙️ Test Setup</button>
          <button class="page-tab"        id="tabScores"     onclick="switchAdminTab('Scores')">📊 Scores</button>
          <button class="page-tab"        id="tabHistory"    onclick="switchAdminTab('History')">📋 Trainee History</button>
          <button class="page-tab"        id="tabReschedule" onclick="switchAdminTab('Reschedule')">
            🔄 Reschedule <span class="tab-badge hidden" id="rsBadge">0</span>
          </button>
          <button class="page-tab" id="tabQBank" onclick="switchAdminTab('QBank')">📚 Question Bank</button>
        </div>
        <div id="adminSetupTab"></div>
        <div id="adminScoresTab"     class="hidden"></div>
        <div id="adminHistoryTab"    class="hidden"></div>
        <div id="adminRescheduleTab" class="hidden"></div>
        <div id="adminQBankTab" class="hidden"></div>
      </div>

      <!-- ===== MOD VIEW ===== -->
      <div id="modView" class="hidden">
        <div class="page-tabs">
          <button class="page-tab active" id="tabModSchedule" onclick="switchModTab('Schedule')">📅 Test Schedule</button>
          <button class="page-tab"        id="tabModScores"   onclick="switchModTab('Scores')">📊 Results</button>
          <button class="page-tab"        id="tabModUsers"    onclick="switchModTab('Users')">👥 Users</button>
        </div>
        <div id="modScheduleTab"></div>
        <div id="modScoresTab"   class="hidden"></div>
        <div id="modUsersTab"    class="hidden"></div>
      </div>

      <!-- ===== TRAINEE VIEW ===== -->
      <div id="traineeView" class="hidden">
        <div id="currentTestCard"></div>
        <div id="rescheduleSection"></div>
        <div class="section-title">My Test History</div>
        <div id="traineeHistoryWrap"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="module-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== DATA =====
const MC_KEY = 'wmt_monthly_config';
const MS_KEY = 'wmt_monthly_scores';
function getMC()      { return JSON.parse(localStorage.getItem(MC_KEY) || '{}'); }
function saveMC(d)    { dbWrite(MC_KEY, JSON.stringify(d)); }
function getMS()      { return JSON.parse(localStorage.getItem(MS_KEY) || '{}'); }

// isBDCS accepts a user object OR a department string.
// User object: checks testGroup override first, then falls back to department.
// String: checks department name directly (no override possible).
function isBDCS(userOrDept) {
  if (userOrDept && typeof userOrDept === 'object') {
    if (userOrDept.testGroup === 'bdcs')   return true;
    if (userOrDept.testGroup === 'others') return false;
    return _checkDeptBDCS(userOrDept.department);
  }
  return _checkDeptBDCS(userOrDept);
}
function _checkDeptBDCS(dept) {
  if (!dept) return false;
  const d = dept.toLowerCase().trim();
  return d==='bd' || d.includes('business dev') ||
         d==='cs' || d.includes('customer serv') ||
         d.includes('sales');
}
function fmtDT(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});
}
function fmtMonth(m) {
  if (!m) return '—';
  const [y,mo] = m.split('-');
  return new Date(+y,+mo-1).toLocaleString('en-GB',{month:'long',year:'numeric'});
}
function getStatus(cfg) {
  // Admin overview: active if ANY group is active, upcoming if ANY group is upcoming
  if (!cfg) return 'none';
  const now=Date.now();
  const starts=[cfg.startDateBDCS,cfg.startDateOthers].filter(Boolean).map(d=>new Date(d).getTime());
  const ends=[cfg.deadlineBDCS,cfg.deadlineOthers].filter(Boolean).map(d=>new Date(d).getTime());
  if (!starts.length) return 'none';
  if (starts.some(s=>ends.some(e=>now>=s&&now<=e))) return 'active';
  if (starts.some(s=>now<s)) return 'upcoming';
  return 'expired';
}
function getStatusFor(cfg, isBDCSUser) {
  if (!cfg) return 'none';
  const s=isBDCSUser?cfg.startDateBDCS:cfg.startDateOthers;
  const e=isBDCSUser?cfg.deadlineBDCS:cfg.deadlineOthers;
  if (!s) return 'none';
  const now=Date.now();
  return now<new Date(s).getTime()?'upcoming':now<=new Date(e).getTime()?'active':'expired';
}
function curMonth() {
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// Question counts per test type
const TEST_QUOTA = { bdcs: { mcq: 55, essay: 5, liet: 10 }, others: { mcq: 25 } };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateTest(month) {
  const results = { bdcs: null, others: null };

  // BD/CS
  const qbBDCS = getQBank('bdcs');
  if (qbBDCS?.questions?.length) {
    const allMCQ     = qbBDCS.questions.filter(q=>q.type==='MCQ');
    const lietPool   = shuffle(allMCQ.filter(q=>q.isLiet));
    const normalPool = shuffle(allMCQ.filter(q=>!q.isLiet));
    const essayPool  = shuffle(qbBDCS.questions.filter(q=>q.type==='Essay'));

    const pickedLiet   = lietPool.slice(0, TEST_QUOTA.bdcs.liet);
    const normalNeeded = TEST_QUOTA.bdcs.mcq - pickedLiet.length;
    const pickedNormal = normalPool.slice(0, normalNeeded);
    const pickedMCQ    = [...pickedLiet, ...pickedNormal];
    const pickedEssay  = essayPool.slice(0, TEST_QUOTA.bdcs.essay);

    if (!pickedMCQ.length && !pickedEssay.length) {
      results.bdcs = { error: 'No questions found in the BD/CS bank.' };
    } else {
      if (pickedLiet.length < TEST_QUOTA.bdcs.liet) {
        console.warn(`BD/CS bank only has ${pickedLiet.length} Liet questions (required: ${TEST_QUOTA.bdcs.liet})`);
      }
      const questions = shuffle([...pickedMCQ, ...pickedEssay]);
      const totalPts  = questions.reduce((s,q)=>s+q.points, 0);
      saveGenTest('bdcs', month, {
        month, generatedAt: new Date().toISOString(),
        questions, totalPoints: totalPts,
        mcqCount: pickedMCQ.length, essayCount: pickedEssay.length,
        lietCount: pickedLiet.length
      });
      results.bdcs = { mcq: pickedMCQ.length, essay: pickedEssay.length, liet: pickedLiet.length };
    }
  }

  // Others
  const qbOthers = getQBank('others');
  if (qbOthers?.questions?.length) {
    const mcqPool = shuffle(qbOthers.questions.filter(q=>q.type==='MCQ'));
    const picked  = mcqPool.slice(0, TEST_QUOTA.others.mcq);
    if (!picked.length) {
      results.others = { error: 'No questions found in the Others bank.' };
    } else {
      const questions = shuffle(picked);
      const totalPts  = questions.reduce((s,q)=>s+q.points, 0);
      saveGenTest('others', month, {
        month, generatedAt: new Date().toISOString(),
        questions, totalPoints: totalPts,
        mcqCount: picked.length, essayCount: 0
      });
      results.others = { mcq: picked.length };
    }
  }

  return results;
}

function regenTest(m) {
  if (!confirm(`Regenerate test for ${fmtMonth(m)}?\n\nNote: If trainees are currently taking the test, they may encounter errors. Regenerate before the test period begins.`)) return;
  const r = generateTest(m);
  const msgs = [];
  if (r.bdcs?.error)   msgs.push('BD/CS: ' + r.bdcs.error);
  if (r.others?.error) msgs.push('Others: ' + r.others.error);
  if (r.bdcs && !r.bdcs.error)   msgs.push(`✅ BD/CS: ${r.bdcs.mcq} MCQ (${r.bdcs.liet} Liet) + ${r.bdcs.essay} Essay`);
  if (r.others && !r.others.error) msgs.push(`✅ Others: ${r.others.mcq} MCQ`);
  if (!r.bdcs && !r.others) msgs.push('⚠️ No question bank uploaded yet.');
  alert('Test generation result:\n\n' + msgs.join('\n'));
  renderSetupTab();
}

function parseQBankFile(file, group, allowEssay) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('SheetJS not loaded, please try again.'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb  = XLSX.read(e.target.result, {type:'binary'});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (raw.length < 2) { alert('File contains no data.'); return; }
      const hdr = raw[0].map(h=>String(h).toLowerCase().replace(/[_\s]/g,''));
      // Exact match first, then substring fallback so "điểm(0-4)" still matches "điểm"
      const col = (...names) => {
        for (const n of names) { const i=hdr.indexOf(n); if(i>=0) return i; }
        for (const n of names) { const i=hdr.findIndex(h=>h.includes(n)); if(i>=0) return i; }
        return -1;
      };
      const qCol  = col('question','câuhỏi','cauhoi','q','nộidung');
      const tCol  = col('type','loại','loai','dạng','dang');
      const aCol  = col('a','optiona','a.');
      const bCol  = col('b','optionb','b.');
      const cCol  = col('c','optionc','c.');
      const dCol  = col('d','optiond','d.');
      const ansCol = col('answer','đápán','dapan','correct','ans','đúng');
      const ptsCol = col('points','điểm','diem','pts','score','đ');
      const lietCol = col('liet','liệt','isliet','điểmliệt','kl');
      const rubricCol = col('rubric','tiêuchí','tieuchi','criteria','hướngdẫn','answerguidance','answerguide','guide','hướngdẫntrảlời');
      if (qCol < 0) { alert('Question column not found. Please check the column names.'); return; }
      if (ptsCol < 0) {
        const foundHdrs = raw[0].join(', ');
        if (!confirm(`⚠️ Points column not found!\n\nDetected headers: ${foundHdrs}\n\nExpected one of: Points, Điểm, Diem, Pts, Score\n\nAll questions will have 0 points. Continue anyway?`)) return;
      }
      const questions = [];
      for (let i=1; i<raw.length; i++) {
        const row = raw[i];
        const text = String(row[qCol]||'').trim();
        if (!text) continue;
        const typeStr = String(row[tCol]||'mcq').toLowerCase();
        const isEssay = allowEssay && (typeStr.includes('essay')||typeStr.includes('tự')||typeStr.includes('tu')||typeStr.includes('luận'));
        const lietStr = String(row[lietCol]||'').toLowerCase();
        const isLiet  = lietStr.includes('y')||lietStr.includes('có')||lietStr.includes('co')||lietStr==='1'||lietStr==='true';
        questions.push({
          id: i,
          text,
          type: isEssay ? 'Essay' : 'MCQ',
          opts: isEssay ? null : { A:String(row[aCol]||''), B:String(row[bCol]||''), C:String(row[cCol]||''), D:String(row[dCol]||'') },
          correct: isEssay ? null : String(row[ansCol]||'').toUpperCase().trim().charAt(0),
          points: parseFloat(row[ptsCol])||0,
          isLiet,
          rubric: String(row[rubricCol]||'')
        });
      }
      if (!questions.length) { alert('No questions could be parsed.'); return; }
      const totalPoints = questions.reduce((s,q)=>s+q.points,0);
      if (totalPoints === 0 && ptsCol >= 0) {
        alert('⚠️ Warning: All questions have 0 points. Check that the Points column contains numeric values.');
      }
      saveQBank(group, { updatedAt:new Date().toISOString(), totalPoints, questions });

      // Auto-regenerate tests for all configured months
      const months = Object.keys(getMC());
      let regenCount = 0;
      months.forEach(m => {
        const r = generateTest(m);
        if ((group==='bdcs' && r.bdcs && !r.bdcs.error) ||
            (group==='others' && r.others && !r.others.error)) regenCount++;
      });
      const regenMsg = regenCount > 0
        ? `\n✅ Test regenerated for ${regenCount} month(s): ${months.join(', ')}`
        : '\n⚠️ No test months configured yet.';
      alert(`Upload successful: ${questions.length} questions, ${totalPoints} points.${regenMsg}`);
      renderQBankTab();
    } catch(err) { alert('File read error: '+err.message); }
  };
  reader.readAsBinaryString(file);
}

function renderModScoresTables() {
  const month  = document.getElementById('modScMonth').value;
  const search = (document.getElementById('modScSearch')?.value || '').toLowerCase().trim();
  const cfg    = getMC()[month];
  const scores = getMS()[month] || {};
  let trainees = Object.entries(getUsersDB()).filter(([,u]) => u.role !== 'admin' && u.role !== 'mod');
  if (search) {
    trainees = trainees.filter(([un, ud]) =>
      [un, ud.fullName||'', ud.workName||'', ud.email||'', ud.department||''].join(' ').toLowerCase().includes(search));
  }
  const bdcs   = trainees.filter(([,u]) => isBDCS(u));
  const others = trainees.filter(([,u]) => !isBDCS(u));
  const passBDCS = cfg.passBDCS ?? 250, lietMax = cfg.lietMax ?? 10, passOthers = cfg.passOthers ?? 70;

  const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  const fmtDur  = (s, e) => {
    if (!s || !e) return '—';
    const m = Math.round((new Date(e)-new Date(s))/60000);
    return m < 60 ? m+'m' : Math.floor(m/60)+'h '+(m%60)+'m';
  };

  function pfBadge(sc, pass, liet, max) {
    if (!sc || sc.score === undefined) return '<span class="pf-badge none">—</span>';
    const ok = sc.score >= pass && (liet === undefined || (sc.liet ?? 0) <= max);
    return ok ? '<span class="pf-badge pass">✓ PASS</span>' : '<span class="pf-badge fail">✗ FAIL</span>';
  }

  function buildBDCS(list) {
    if (!list.length) return `<div class="score-section-empty">No trainees in this group.</div>`;
    return `<div class="score-section-body"><table><thead><tr>
      <th>#</th><th>Full Name</th><th>Username</th><th>Type</th><th>Submission</th>
      <th>Start</th><th>Submit</th><th>Duration</th><th>Score (0–300)</th><th>Liet ×</th><th>Pass / Fail</th>
    </tr></thead><tbody>
      ${list.map(([un,ud],idx) => {
        const sc = scores[un], sub = getSubmission(un, month);
        const isOld = (ud.employeeType||'new') === 'old';
        const typeBadge = isOld
          ? `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,214,143,0.12);color:var(--success);">🏅 Existed</span>`
          : `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,61,113,0.1);color:var(--danger);">🆕 New</span>`;

          : `<span style="font-size:0.72rem;color:var(--text-muted)">Not Submitted</span>`;
        const scoreVal = sc?.score ?? (sub?.mcqScore ?? '—');

          <td>${typeBadge}</td>
          <td>${subBadge}</td>
          <td style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap">${fmtTime(sub?.startedAt)}</td>
          <td style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap">${fmtTime(sub?.submittedAt)}</td>
          <td style="font-size:0.75rem;font-weight:600;white-space:nowrap">${fmtDur(sub?.startedAt,sub?.submittedAt)}</td>
          <td style="font-weight:700;color:var(--gold)">${scoreVal}</td>
          <td style="color:var(--text-muted)">${lietVal}</td>
          <td>${pfBadge(sc, passBDCS, true, lietMax)}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
  }

  function buildOthers(list) {
    if (!list.length) return `<div class="score-section-empty">No trainees in this group.</div>`;
    return `<div class="score-section-body"><table><thead><tr>
      <th>#</th><th>Full Name</th><th>Username</th><th>Type</th><th>Submission</th>
      <th>Start</th><th>Submit</th><th>Duration</th><th>Score (0–100)</th><th>Pass / Fail</th>
    </tr></thead><tbody>
      ${list.map(([un,ud],idx) => {
        const sc = scores[un], sub = getSubmission(un, month);
        const autoScore = (!sc?.score && sub?.mcqScore != null) ? sub.mcqScore : null;
        const displayScore = sc?.score ?? autoScore ?? '—';
        const isOld = (ud.employeeType||'new') === 'old';
        const typeBadge = isOld
          ? `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,214,143,0.12);color:var(--success);">🏅 Existed</span>`
          : `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,61,113,0.1);color:var(--danger);">🆕 New</span>`;
        const subBadge = sub
          ? `<span style="font-size:0.72rem;font-weight:700;color:var(--success)">✅ Submitted</span>`
          : `<span style="font-size:0.72rem;color:var(--text-muted)">Not Submitted</span>`;
        const pfSc = displayScore !== '—' ? { score: displayScore } : sc;
        const ok = pfSc?.score != null && pfSc.score >= passOthers;
        const pfBadgeEl = pfSc?.score != null
          ? (ok ? '<span class="pf-badge pass">✓ PASS</span>' : '<span class="pf-badge fail">✗ FAIL</span>')
          : '<span class="pf-badge none">—</span>';
        return `<tr>
          <td style="color:var(--text-muted);font-size:0.78rem">${idx+1}</td>

          <td style="font-weight:600;color:var(--text-primary)">${un}</td>

          <td style="font-size:0.75rem;font-weight:600;white-space:nowrap">${fmtDur(sub?.startedAt,sub?.submittedAt)}</td>
          <td style="font-weight:700;color:var(--gold)">${displayScore}</td>

        </tr>`;
      }).join('')}

  document.getElementById('modScoresTables').innerHTML = `
    <div class="score-section"><div class="score-section-hdr"><h3>🏢 BD & CS</h3><span class="score-count">${bdcs.length} trainees</span></div>${buildBDCS(bdcs)}</div>

}

function exportModScoresExcel() {
  if (typeof XLSX === 'undefined') { alert('SheetJS not loaded. Please reload the page and try again.'); return; }

  const month  = document.getElementById('modScMonth')?.value;
  if (!month) return;

  const cfg      = getMC()[month];
  const scores   = getMS()[month] || {};
  const passBDCS = cfg?.passBDCS   ?? 250;
  const lietMax  = cfg?.lietMax    ?? 10;
  const passOth  = cfg?.passOthers ?? 70;

  const trainees = Object.entries(getUsersDB()).filter(([,u]) => u.role !== 'admin' && u.role !== 'mod');

  const bdcs   = trainees.filter(([,u]) => isBDCS(u));
  const others = trainees.filter(([,u]) => !isBDCS(u));

  const fmtT = iso => iso ? new Date(iso).toLocaleString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const fmtD = (s, e) => {
    if (!s || !e) return '';
    const m = Math.round((new Date(e) - new Date(s)) / 60000);
    return m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + (m%60) + 'm';
  };
  const pfText = (passed) => passed === true ? 'PASS' : passed === false ? 'FAIL' : '—';

  // ── BD & CS sheet ──
  const bdcsRows = [
    ['#', 'Full Name', 'Username', 'Department', 'Type', 'Submitted', 'Start Time', 'Submit Time', 'Duration', 'Score (0–300)', 'Liet ×', 'Pass / Fail']
  ];
  bdcs.forEach(([un, ud], i) => {
    const sc  = scores[un];
    const sub = getSubmission(un, month);
    const scoreVal = sc?.score ?? sub?.mcqScore ?? '';
    const lietVal  = sc?.liet  ?? sub?.lietWrong ?? '';
    const passed   = scoreVal !== '' ? (scoreVal >= passBDCS && (lietVal === '' || lietVal <= lietMax)) : undefined;
    bdcsRows.push([
      i + 1,
      ud.fullName || un,
      un,
      ud.department || '',
      (ud.employeeType || 'new') === 'old' ? 'Existed' : 'New',
      sub ? 'Submitted' : 'Not Submitted',
      fmtT(sub?.startedAt),
      fmtT(sub?.submittedAt),
      fmtD(sub?.startedAt, sub?.submittedAt),
      scoreVal,
      lietVal,
      pfText(passed)
    ]);
  });

  // ── Others sheet ──
  const othRows = [
    ['#', 'Full Name', 'Username', 'Department', 'Type', 'Submitted', 'Start Time', 'Submit Time', 'Duration', 'Score (0–100)', 'Pass / Fail']
  ];
  others.forEach(([un, ud], i) => {
    const sc   = scores[un];
    const sub  = getSubmission(un, month);
    const autoScore = (sc?.score == null && sub?.mcqScore != null) ? sub.mcqScore : null;
    const scoreVal  = sc?.score ?? autoScore ?? '';
    const passed    = scoreVal !== '' ? scoreVal >= passOth : undefined;
    othRows.push([
      i + 1,
      ud.fullName || un,
      un,
      ud.department || '',
      (ud.employeeType || 'new') === 'old' ? 'Existed' : 'New',
      sub ? 'Submitted' : 'Not Submitted',
      fmtT(sub?.startedAt),
      fmtT(sub?.submittedAt),
      fmtD(sub?.startedAt, sub?.submittedAt),
      scoreVal,
      pfText(passed)
    ]);
  });

  // ── Build workbook ──
  const wb = XLSX.utils.book_new();

  const wsBDCS = XLSX.utils.aoa_to_sheet(bdcsRows);
  const wsOth  = XLSX.utils.aoa_to_sheet(othRows);

  // Column widths
  wsBDCS['!cols'] = [4,22,14,16,10,14,18,18,10,14,8,12].map(w => ({ wch: w }));
  wsOth['!cols']  = [4,22,14,16,10,14,18,18,10,14,12].map(w => ({ wch: w }));

  XLSX.utils.book_append_sheet(wb, wsBDCS, 'BD & CS');
  XLSX.utils.book_append_sheet(wb, wsOth,  'Other Departments');

  const monthLabel = fmtMonth(month).replace(/\s+/g, '_');
  XLSX.writeFile(wb, `WMT_Monthly_Scores_${monthLabel}.xlsx`);
}

function exportModUsersExcel() {
  if (typeof XLSX === 'undefined') { alert('SheetJS not loaded. Please reload and try again.'); return; }

  const users    = getUsersDB();
  const trainees = Object.entries(users)
    .filter(([, u]) => u.role !== 'admin')
    .sort(([a], [b]) => a.localeCompare(b));

  const fmtT = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

  const header = ['#', 'Username', 'Work Name', 'Full Name', 'Email', 'Department', 'Position', 'Role', 'Type', 'Final Exam', 'Exam Score %', 'Joined'];
  const rows = trainees.map(([un, ud], i) => {
    const ex = JSON.parse(localStorage.getItem('wmt_exam_' + un) || '{}');
    let examStatus = 'Not Started';
    let examPct    = '';
    if (ex.disqualified)       { examStatus = 'Disqualified'; }
    else if (ex.passed)        { examStatus = 'Passed'; examPct = Math.round((ex.score / (ex.total || 30)) * 100) + '%'; }
    else if (ex.score != null) { examStatus = `Failed (${ex.attempts || 1} attempt${ex.attempts > 1 ? 's' : ''})`; examPct = Math.round((ex.score / (ex.total || 30)) * 100) + '%'; }
    return [
      i + 1,
      un,
      ud.workName    || '',
      ud.fullName    || '',
      ud.email       || '',
      ud.department  || '',
      ud.position    || '',
      ud.role        || 'trainee',
      (ud.employeeType || 'new') === 'old' ? 'Existed' : 'New',
      examStatus,
      examPct,
      fmtT(ud.createdAt)
    ];
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = [4, 14, 16, 22, 24, 18, 16, 10, 10, 18, 12, 14].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Users');
  XLSX.writeFile(wb, `WMT_Users_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

// ===== NOTIFICATIONS =====
const NOTIF_PREFS_KEY = u => 'wmt_notif_prefs_' + u;

function getNotifPrefs(u) {
  const defaults = {
    enabled: false,
    permission: 'default',
    reminders: ['24h', '1h', 'start', '2hClose'],
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
  const stored = JSON.parse(localStorage.getItem(NOTIF_PREFS_KEY(u)) || 'null');
  return stored ? Object.assign({}, defaults, stored) : defaults;
}

function saveNotifPrefs(u, prefs) {
  localStorage.setItem(NOTIF_PREFS_KEY(u), JSON.stringify(prefs));
  if (window.FDB) window.FDB.ref('notif_prefs/' + u).set(prefs)
    .catch(e => console.warn('[WMT] notifPrefs sync error:', e.message));
}

function fmtLocalTime(iso, tz) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', timeZone: tz, timeZoneName: 'short'
    });
  } catch { return new Date(iso).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
}

function getUpcomingTestsForUser(u) {
  const mc = getMC();
  const months = Object.keys(mc).sort().reverse();
  const user = ALL_USERS[u] || {};
  const bdcs = isBDCS(user);
  const now = Date.now();
  return months.map(m => {
    const cfg = mc[m];
    const start = bdcs ? cfg.startDateBDCS : cfg.startDateOthers;
    const end   = bdcs ? cfg.deadlineBDCS  : cfg.deadlineOthers;
    const startTs = start ? new Date(start).getTime() : null;
    const endTs   = end   ? new Date(end).getTime()   : null;
    let status = 'none';
    if (startTs) {
      if (now < startTs)           status = 'upcoming';
      else if (!endTs || now <= endTs) status = 'active';
      else                         status = 'expired';
    }
    return { m, cfg, start, end, startTs, endTs, status, bdcs };
  }).filter(t => t.status === 'upcoming' || t.status === 'active');
}

function scheduleReminderNotifs(u) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const prefs = getNotifPrefs(u);
  if (!prefs.enabled) return;
  const tests = getUpcomingTestsForUser(u);
  if (!tests.length) return;
  const { start, startTs, endTs, m } = tests[0];
  if (!startTs) return;
  const now = Date.now();

  const slots = [
    { key: '24h',     fireAt: startTs - 86400000, body: '24 hours to go! — ' + fmtMonth(m) },
    { key: '1h',      fireAt: startTs - 3600000,  body: '1 hour until test opens — ' + fmtMonth(m) },
    { key: 'start',   fireAt: startTs,             body: 'Test is now OPEN — ' + fmtMonth(m) },
    { key: '2hClose', fireAt: endTs ? endTs - 7200000 : null, body: '2 hours left to submit — ' + fmtMonth(m) },
  ];

  slots.forEach(({ key, fireAt, body }) => {
    if (!prefs.reminders.includes(key) || !fireAt) return;
    const delay = fireAt - now;
    if (delay > 0 && delay < 172800000) { // within 48h
      setTimeout(() => {
        if (Notification.permission === 'granted') {
          new Notification('📅 WMT Monthly Test', { body, icon: '', tag: 'wmt-' + m + '-' + key });
        }
      }, delay);
    }
  });
}

async function requestNotifPermission() {
  const u = CUR_USER;
  if (!('Notification' in window)) { alert('Browser notifications are not supported.'); return; }
  const perm = await Notification.requestPermission();
  const prefs = getNotifPrefs(u);
  prefs.enabled  = perm === 'granted';
  prefs.permission = perm;
  saveNotifPrefs(u, prefs);
  updateNotifBell();
  renderNotifPanel();
  if (perm === 'granted') {
    scheduleReminderNotifs(u);
    new Notification('📅 WMT Monthly Test', { body: 'Notifications enabled! You will be reminded before tests.', tag: 'wmt-test-on' });
  }
}

function toggleNotifReminderKey(key) {
  const u = CUR_USER;
  const prefs = getNotifPrefs(u);
  const idx = prefs.reminders.indexOf(key);
  if (idx >= 0) prefs.reminders.splice(idx, 1);
  else prefs.reminders.push(key);
  saveNotifPrefs(u, prefs);
  renderNotifPanel();
}

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  const bell  = document.getElementById('notifBell');
  const open  = panel.classList.toggle('hidden');
  bell.classList.toggle('active', !open);
  if (!open) renderNotifPanel();
}

function updateNotifBell() {
  const u = CUR_USER;
  if (!u) return;
  const tests = getUpcomingTestsForUser(u);
  const badge = document.getElementById('notifBadge');
  if (!badge) return;
  badge.textContent = tests.length;
  badge.classList.toggle('hidden', tests.length === 0);
}

function renderNotifPanel() {
  const panel = document.getElementById('notifPanel');
  if (!panel || panel.classList.contains('hidden')) return;
  const u     = CUR_USER;
  const prefs = getNotifPrefs(u);
  const tz    = prefs.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tests = getUpcomingTestsForUser(u);
  const perm  = ('Notification' in window) ? Notification.permission : 'unsupported';

  /* --- Upcoming test rows --- */
  const testRows = tests.length
    ? tests.map(t => {
        const badge = t.status === 'active'
          ? `<span style="color:var(--success);font-size:0.75rem;font-weight:700;">🟢 Active</span>`
          : `<span style="color:#6496ff;font-size:0.75rem;font-weight:700;">🔵 Upcoming</span>`;
        return `<div class="notif-test-row">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="notif-test-month">${fmtMonth(t.m)}</span>${badge}
          </div>
          <div class="notif-test-time">
            🟢 Opens: <strong>${fmtLocalTime(t.start, tz)}</strong><br>
            🔴 Closes: <strong>${fmtLocalTime(t.end, tz)}</strong>
          </div>
        </div>`;
      }).join('')
    : `<div style="color:var(--text-muted);font-size:0.83rem;padding:10px 0;">No upcoming or active tests.</div>`;

  /* --- Reminder checkboxes (only when notifications enabled) --- */
  const REMINDER_OPTS = [
    { key: '24h',     label: '24 hours before test opens' },
    { key: '1h',      label: '1 hour before test opens' },
    { key: 'start',   label: 'When test opens' },
    { key: '2hClose', label: '2 hours before deadline' },
  ];

  let notifSection = '';
  if (perm === 'unsupported') {
    notifSection = `<p class="notif-status-msg" style="color:var(--text-muted);">Browser notifications not supported.</p>`;
  } else if (perm === 'denied') {
    notifSection = `<p class="notif-status-msg" style="color:var(--danger);">⚠️ Notifications blocked. Please allow in browser settings, then reload.</p>`;
  } else if (!prefs.enabled || perm !== 'granted') {
    notifSection = `
      <p style="font-size:0.78rem;color:var(--text-muted);margin-top:14px;line-height:1.6;">
        Enable browser notifications to get automatic reminders before each test, timed to your timezone.
      </p>
      <button class="notif-enable-btn" onclick="requestNotifPermission()">🔔 Enable Notifications</button>`;
  } else {
    const checks = REMINDER_OPTS.map(({ key, label }) => `
      <label class="notif-check-row">
        <input type="checkbox" ${prefs.reminders.includes(key) ? 'checked' : ''}
          onchange="toggleNotifReminderKey('${key}')"
          style="accent-color:var(--gold);width:15px;height:15px;flex-shrink:0;cursor:pointer;">
        <span class="notif-check-label">${label}</span>
      </label>`).join('');
    notifSection = `
      <div style="margin-top:14px;">
        <div class="notif-section-hdr">Remind me</div>
        ${checks}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button onclick="requestNotifPermission()"
            style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.75rem;cursor:pointer;">
            🔄 Re-check permission
          </button>
          <button onclick="disableNotifications()"
            style="padding:6px 12px;background:rgba(255,61,113,0.08);border:1px solid rgba(255,61,113,0.25);border-radius:8px;color:var(--danger);font-size:0.75rem;cursor:pointer;">
            🔕 Turn off
          </button>
        </div>
      </div>`;
  }

  /* --- Timezone row --- */
  const tzRow = `<div class="notif-tz-row">🌍 <strong>${tz}</strong></div>`;

  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <strong style="font-size:0.95rem;">🔔 Test Notifications</strong>
      <button onclick="toggleNotifPanel()" style="background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;line-height:1;">✕</button>
    </div>
    ${tzRow}
    <div class="notif-section-hdr">Upcoming Tests</div>
    ${testRows}
    ${notifSection}`;
}

function disableNotifications() {
  const u = CUR_USER;
  const prefs = getNotifPrefs(u);
  prefs.enabled = false;
  saveNotifPrefs(u, prefs);
  renderNotifPanel();
}

function initNotifications() {
  const u = CUR_USER;
  if (!u) return;
  // Show bell for trainee + mod (not admin, who sees full schedule already)
  if (!IS_ADMIN) document.getElementById('notifBellWrap').style.display = '';
  // Detect & persist timezone
  const detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const prefs = getNotifPrefs(u);
  if (prefs.timezone !== detectedTz) {
    prefs.timezone = detectedTz;
    saveNotifPrefs(u, prefs);
  }
  // Update badge
  updateNotifBell();
  // Schedule browser reminders if already enabled
  if (prefs.enabled && ('Notification' in window) && Notification.permission === 'granted') {
    scheduleReminderNotifs(u);
  }
  // Close panel on outside click
  document.addEventListener('click', e => {
    const panel = document.getElementById('notifPanel');
    const bell  = document.getElementById('notifBell');
    if (panel && !panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== bell && !bell.contains(e.target)) {
      panel.classList.add('hidden');
      bell.classList.remove('active');
    }
  }, true);
}

function toLocalDTInput(iso) {
  if (!iso) return '';
  // Convert UTC ISO → local datetime-local string (YYYY-MM-DDTHH:MM)
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function loadCfg(m) {
  const c=getMC()[m]||{};
  document.getElementById('cfgMonth').value        = m;
  document.getElementById('cfgTitle').value        = c.title||'';
  document.getElementById('cfgStartBDCS').value    = toLocalDTInput(c.startDateBDCS);
  document.getElementById('cfgDeadlineBDCS').value = toLocalDTInput(c.deadlineBDCS);
  document.getElementById('cfgLinkBDCS').value     = c.testLinkBDCS||'';
  document.getElementById('cfgPassBDCS').value     = c.passBDCS!==undefined ? c.passBDCS : 250;
  document.getElementById('cfgLietMax').value      = c.lietMax!==undefined  ? c.lietMax  : 10;
  document.getElementById('cfgStartOthers').value    = toLocalDTInput(c.startDateOthers);
  document.getElementById('cfgDeadlineOthers').value = toLocalDTInput(c.deadlineOthers);
  document.getElementById('cfgLinkOthers').value     = c.testLinkOthers||'';
  document.getElementById('cfgPassOthers').value     = c.passOthers!==undefined ? c.passOthers : 70;
  document.getElementById('cfgDriveLink').value      = c.driveLink||'';
  window.scrollTo({top:0,behavior:'smooth'});
}

function saveTestConfig() {
  const toUTC = v => v ? new Date(v).toISOString() : '';
  const month=document.getElementById('cfgMonth').value,
        title=document.getElementById('cfgTitle').value.trim(),
        startDateBDCS=toUTC(document.getElementById('cfgStartBDCS').value),
        deadlineBDCS=toUTC(document.getElementById('cfgDeadlineBDCS').value),
        startDateOthers=toUTC(document.getElementById('cfgStartOthers').value),
        deadlineOthers=toUTC(document.getElementById('cfgDeadlineOthers').value),
        testLinkBDCS=document.getElementById('cfgLinkBDCS').value.trim(),
        testLinkOthers=document.getElementById('cfgLinkOthers').value.trim(),
        passBDCS=parseInt(document.getElementById('cfgPassBDCS').value)||250,
        lietMax=parseInt(document.getElementById('cfgLietMax').value)||10,
        passOthers=parseInt(document.getElementById('cfgPassOthers').value)||70,
        driveLink=document.getElementById('cfgDriveLink').value.trim(),
        err=document.getElementById('cfgErr');
  err.textContent='';
  if (!month)           { err.textContent='Please select a month.'; return; }
  if (!startDateBDCS)   { err.textContent='Please set BD & CS start date & time.'; return; }
  if (!deadlineBDCS)    { err.textContent='Please set BD & CS deadline.'; return; }
  if (new Date(deadlineBDCS)<=new Date(startDateBDCS)) { err.textContent='BD & CS: deadline must be after start.'; return; }
  if (!startDateOthers) { err.textContent='Please set Other Departments start date & time.'; return; }
  if (!deadlineOthers)  { err.textContent='Please set Other Departments deadline.'; return; }
  if (new Date(deadlineOthers)<=new Date(startDateOthers)) { err.textContent='Other Departments: deadline must be after start.'; return; }
  const cfgs=getMC();
  const isNew = !cfgs[month];
  cfgs[month]={ month, title:title||fmtMonth(month), startDateBDCS, deadlineBDCS, startDateOthers, deadlineOthers, testLinkBDCS, testLinkOthers, passBDCS, lietMax, passOthers, driveLink,
    createdAt: cfgs[month]?.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString() };
  saveMC(cfgs);

  // Auto-generate test when creating new month config
  if (isNew) {
    const r = generateTest(month);
    const genMsgs = [];
    if (r.bdcs && !r.bdcs.error)   genMsgs.push(`🏢 BD/CS: ${r.bdcs.mcq} MCQ (${r.bdcs.liet} Liet) + ${r.bdcs.essay} Essay`);
    if (r.others && !r.others.error) genMsgs.push(`🏛️ Others: ${r.others.mcq} MCQ`);
    if (genMsgs.length) {
      document.getElementById('cfgErr').style.color = 'var(--success)';
      document.getElementById('cfgErr').textContent = '✅ Saved & test generated automatically: ' + genMsgs.join(' · ');
    } else {
      document.getElementById('cfgErr').style.color = 'var(--warning)';
      document.getElementById('cfgErr').textContent = '✅ Saved. No question bank yet — upload a file in the Question Bank tab to generate a test.';
    }
  } else {
    document.getElementById('cfgErr').style.color = 'var(--success)';
    document.getElementById('cfgErr').textContent = '✅ Configuration updated.';
  }
  renderSetupTab();
}

function deleteCfg(m) {
  if (!confirm(`Delete test configuration for ${fmtMonth(m)}?`)) return;
  const cfgs=getMC(); delete cfgs[m]; saveMC(cfgs);
  delGenTest('bdcs', m); delGenTest('others', m);
  renderSetupTab();
}

function renderScoresTables() {
  const month  = document.getElementById('scMonth').value;
  const search = (document.getElementById('scSearch')?.value || '').toLowerCase().trim();
  const cfg    = getMC()[month];
  const scores = getMS()[month]||{};
  let trainees = Object.entries(getUsersDB()).filter(([,u])=>u.role!=='admin');

  if (search) {
    trainees = trainees.filter(([uname, ud]) => {
      const hay = [uname, ud.fullName||'', ud.workName||'', ud.email||'', ud.department||'', ud.leaderName||''].join(' ').toLowerCase();
      return hay.includes(search);
    });
  }

  const bdcs   = trainees.filter(([,u])=>isBDCS(u));
  const others = trainees.filter(([,u])=>!isBDCS(u));

  const passBDCS   = cfg.passBDCS   ?? 250;
  const lietMax    = cfg.lietMax    ?? 10;
  const passOthers = cfg.passOthers ?? 70;

  function pfBDCS(sc) {
    if (!sc || sc.score===undefined) return 'none';
    return sc.score >= passBDCS && (sc.liet??0) <= lietMax ? 'pass' : 'fail';
  }
  function pfOthers(sc) {
    if (!sc || sc.score===undefined) return 'none';
    return sc.score >= passOthers ? 'pass' : 'fail';
  }

  function buildRowsBDCS(list) {
    if (!list.length) return `<div class="score-section-empty">No trainees in this group.</div>`;
    return `<div class="score-section-body"><table><thead><tr>
      <th>#</th><th>Full Name</th><th>Username</th><th>Type</th><th>Submission Status</th>
      <th>Start</th><th>Submit</th><th>Duration</th>
      <th>Score (0–300)</th><th>Liet ×</th><th>Pass / Fail</th><th></th>
    </tr></thead><tbody>
      ${list.map(([un,ud], idx)=>{
        const sc  = scores[un];
        const sub = getSubmission(un, month);
        const suggestScore = (sc?.score==null && sub) ? sub.mcqScore : null;
        const pct  = sc?.score ?? null;
        const liet = sc?.liet  ?? (sub?.lietWrong ?? null);
        const pf   = pfBDCS(sc); const pfTxt={pass:'✓ PASS',fail:'✗ FAIL',none:'—'}[pf];
        const isOld = (ud.employeeType||'new') === 'old';
        const typeBadge = isOld
          ? `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,214,143,0.12);color:var(--success);">🏅 Existed</span>`
          : `<span style="font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,61,113,0.1);color:var(--danger);">🆕 New</span>`;
        const subBadge = sub
          ? `<span style="font-size:0.72rem;font-weight:700;color:var(--success)">✅ Submitted</span>

  document.getElementById('scoresTables').innerHTML=`

function liveUpdatePFBDCS(un, passBDCS, lietMax) {
  const v  = parseFloat(document.getElementById(`sc_bdcs_${un}`).value);
  const lv = parseInt(document.getElementById(`liet_${un}`).value) || 0;
  const el = document.getElementById(`pf_bdcs_${un}`);
  if (isNaN(v)) { el.className='pf-badge none'; el.textContent='—'; return; }
  const pass = v >= passBDCS && lv <= lietMax;
  el.className = `pf-badge ${pass?'pass':'fail'}`;
  el.textContent = pass ? '✓ PASS' : '✗ FAIL';
}

function liveUpdatePFOthers(un, passOthers) {
  const v  = parseFloat(document.getElementById(`sc_others_${un}`).value);
  const el = document.getElementById(`pf_others_${un}`);
  if (isNaN(v)) { el.className='pf-badge none'; el.textContent='—'; return; }
  const pass = v >= passOthers;
  el.className = `pf-badge ${pass?'pass':'fail'}`;
  el.textContent = pass ? '✓ PASS' : '✗ FAIL';
}

function saveOneBDCS(un, month, passBDCS, lietMax) {
  const v    = parseFloat(document.getElementById(`sc_bdcs_${un}`).value);
  const liet = parseInt(document.getElementById(`liet_${un}`).value) || 0;
  if (isNaN(v)||v<0||v>300) { alert('Score must be 0–300.'); return; }
  const all=getMS(); if (!all[month]) all[month]={};
  all[month][un]={ score:v, liet, passed: v>=passBDCS && liet<=lietMax, gradedAt:new Date().toISOString() };
  saveMS(all); renderScoresTables();
}

function saveAllBDCS(month) {
  const cfg = getMC()[month] || {};
  const passBDCS = cfg.passBDCS ?? 250;
  const lietMax  = cfg.lietMax  ?? 10;
  const all = getMS();
  if (!all[month]) all[month] = {};
  let saved = 0, skipped = 0;
  document.querySelectorAll('[id^="sc_bdcs_"]').forEach(inp => {
    const un = inp.id.replace('sc_bdcs_', '');
    const v = parseFloat(inp.value);
    if (isNaN(v) || v < 0 || v > 300) { skipped++; return; }
    const liet = parseInt(document.getElementById(`liet_${un}`)?.value) || 0;
    all[month][un] = { score: v, liet, passed: v >= passBDCS && liet <= lietMax, gradedAt: new Date().toISOString() };
    saved++;
  });
  if (!saved) { alert('No valid scores to save. Fill in score fields first.'); return; }
  saveMS(all);
  renderScoresTables();
  if (skipped) alert(`Saved ${saved} score${saved !== 1 ? 's' : ''}. Skipped ${skipped} row${skipped !== 1 ? 's' : ''} with blank/invalid scores.`);
}

function saveOneOthers(un, month, passOthers) {
  const v = parseFloat(document.getElementById(`sc_others_${un}`).value);
  if (isNaN(v)||v<0||v>100) { alert('Score must be 0–100.'); return; }
  const all=getMS(); if (!all[month]) all[month]={};
  all[month][un]={ score:v, passed: v>=passOthers, gradedAt:new Date().toISOString() };
  saveMS(all); renderScoresTables();
}

// ===== AI ESSAY GRADING =====
let _essayCtx = null;
let _essayTemplate = null;

function preScoreByKeywords(answer, keywords, required, maxPoints) {
  if (!keywords || !keywords.length || !required) return null;
  const norm = (answer || '').toLowerCase();
  const found = keywords.filter(kw => norm.includes(kw.toLowerCase()));
  const score = Math.round((Math.min(found.length, required) / required) * maxPoints * 10) / 10;
  return { score, found, missing: keywords.filter(kw => !norm.includes(kw.toLowerCase())) };
}

function kwPreScoreModal() {
  const ctx = _essayCtx;
  if (!ctx) return;
  let anyKeywords = false;
  for (const [qid, q] of Object.entries(ctx.essayMap)) {
    if (!q.keywords || !q.keywords.length) continue;
    anyKeywords = true;
    const r = preScoreByKeywords(q.ans, q.keywords, q.keywordsRequired, q.maxPts);
    if (!r) continue;
    const scoreEl = document.getElementById(`essay_score_${qid}`);
    if (scoreEl && !scoreEl.value) scoreEl.value = r.score;
    const hintEl = document.getElementById(`kw_hint_${qid}`);
    if (hintEl) {
      const fnd = r.found.map(k => `<span style="color:var(--success);background:rgba(0,200,100,0.1);border-radius:3px;padding:0 6px;margin:2px;display:inline-block;">${k}</span>`).join('');
      const mis = r.missing.map(k => `<span style="color:var(--danger);background:rgba(255,80,80,0.07);border-radius:3px;padding:0 6px;margin:2px;display:inline-block;text-decoration:line-through;">${k}</span>`).join('');
      hintEl.innerHTML = `🔑 ${fnd}${mis ? `<span style="color:var(--text-muted);margin:0 4px;">missing:</span>${mis}` : ''} <span style="margin-left:6px;font-weight:600;">→ ${r.score}/${q.maxPts}</span>`;
      hintEl.style.display = 'block';
    }
  }
  if (!anyKeywords) alert('No keywords configured for any essay question.\nConfigure via ✏️ Edit Questions → Essay question → Keywords field.');
}

function saveEssayTemplate() {
  const ctx = _essayCtx;
  if (!ctx) return;
  const scores = {};
  for (const qid of Object.keys(ctx.essayMap)) {
    const v = parseFloat(document.getElementById(`essay_score_${qid}`)?.value);
    if (!isNaN(v)) scores[qid] = v;
  }
  if (!Object.keys(scores).length) { alert('Enter at least one score before saving as template.'); return; }
  _essayTemplate = { month: ctx.month, scores };
  const btn = document.getElementById('essTemplateSaveBtn');
  if (btn) { btn.textContent = '✅ Saved!'; setTimeout(() => { btn.textContent = '📋 Save as Template'; }, 2000); }
}

function applyTemplateToAll(month) {
  if (!_essayTemplate || _essayTemplate.month !== month) { alert('No template saved for this month.'); return; }
  const cfg = getMC()[month] || {};
  const passBDCS = cfg.passBDCS ?? 250;
  const lietMax  = cfg.lietMax  ?? 10;
  const ms = getMS();
  if (!ms[month]) ms[month] = {};
  let count = 0;
  Object.entries(getUsersDB()).forEach(([un, ud]) => {
    if (!isBDCS(ud)) return;
    const sub = getSubmission(un, month);
    if (!sub || !sub.submittedAt || !sub.essayAnswers) return;
    const essayTotal = Object.values(_essayTemplate.scores).reduce((a, b) => a + b, 0);
    sub.essayScores = { ..._essayTemplate.scores };
    sub.essayTotal = essayTotal;
    sub.essayPending = false;
    saveSubmission(un, month, sub);
    const total = (sub.mcqScore || 0) + essayTotal;
    const liet = ms[month]?.[un]?.liet ?? sub.lietWrong ?? 0;
    ms[month][un] = { score: total, liet, passed: total >= passBDCS && liet <= lietMax, gradedAt: new Date().toISOString() };
    count++;
  });
  if (!count) { alert('No pending submissions found to apply template to.'); return; }
  saveMS(ms);
  document.getElementById('bulkEssayModal')?.remove();
  renderScoresTables();
  alert(`Template applied and saved for ${count} submission${count !== 1 ? 's' : ''}.`);
}

function bulkApplyKeywords(month) {
  const gt = getGenTest('bdcs', month);
  const qb = getQBank('bdcs');
  const cfg = getMC()[month] || {};
  const passBDCS = cfg.passBDCS ?? 250;
  const lietMax  = cfg.lietMax  ?? 10;
  const qs = (gt?.questions || qb?.questions || []).filter(q => q.type === 'Essay');
  const ms = getMS();
  if (!ms[month]) ms[month] = {};
  let applied = 0;
  Object.entries(getUsersDB()).forEach(([un, ud]) => {
    if (!isBDCS(ud)) return;
    const sub = getSubmission(un, month);
    if (!sub || !sub.submittedAt || !sub.essayAnswers) return;
    let essayTotal = 0;
    const essayScores = {};
    for (const q of qs) {
      if (!q.keywords || !q.keywords.length) continue;
      const r = preScoreByKeywords(sub.essayAnswers[q.id] || '', q.keywords, q.keywordsRequired || 1, q.points || 0);
      if (r) { essayScores[q.id] = r.score; essayTotal += r.score; }
    }
    if (!Object.keys(essayScores).length) return;
    sub.essayScores = essayScores; sub.essayTotal = essayTotal; sub.essayPending = false;
    saveSubmission(un, month, sub);
    const total = (sub.mcqScore || 0) + essayTotal;
    const liet = ms[month]?.[un]?.liet ?? sub.lietWrong ?? 0;
    ms[month][un] = { score: total, liet, passed: total >= passBDCS && liet <= lietMax, gradedAt: new Date().toISOString() };
    applied++;
  });
  if (!applied) { alert('No pending submissions with configured keywords found.'); return; }
  saveMS(ms);
  document.getElementById('bulkEssayModal')?.remove();
  renderScoresTables();
  alert(`Keyword scores applied and saved for ${applied} submission${applied !== 1 ? 's' : ''}. Review individually with 📝 Grade.`);
}

function openBulkEssayModal(month) {
  const gt = getGenTest('bdcs', month);
  const qb = getQBank('bdcs');
  const qs = (gt?.questions || qb?.questions || []).filter(q => q.type === 'Essay');
  if (!qs.length) { alert('No essay questions found for this month.'); return; }
  const ms = getMS()[month] || {};
  const hasKeywords = qs.some(q => q.keywords && q.keywords.length);
  const users = Object.entries(getUsersDB())
    .filter(([, ud]) => isBDCS(ud))
    .map(([un, ud]) => ({ un, ud, sub: getSubmission(un, month) }))
    .filter(({ sub }) => sub && sub.submittedAt && sub.essayAnswers)
    .sort((a, b) => a.un.localeCompare(b.un));
  if (!users.length) { alert('No submitted essays found.'); return; }

  document.getElementById('bulkEssayModal')?.remove();
  const modal = document.createElement('div');
  modal.id = 'bulkEssayModal';
  modal.className = 'modal-overlay show';

  const kwHeaders = hasKeywords ? `<th style="text-align:center;padding:6px 10px;">Keyword Pre-score<br><span style="font-size:0.7rem;font-weight:400;">${qs.map((_, i) => 'Q' + (i + 1)).join(' / ')} + MCQ</span></th>` : '';

  const userRows = users.map(({ un, ud, sub }) => {
    const existScore = ms[un] ? `${ms[un].score}pts` : (sub.essayScores ? `~${(sub.mcqScore||0)+(sub.essayTotal||0)}pts` : '—');
    const statusBadge = sub.essayPending
      ? `<span style="color:var(--warning,#f59e0b);font-size:0.72rem;">⏳ Pending</span>`
      : `<span style="color:var(--success);font-size:0.72rem;">✅ Scored</span>`;

    let kwCell = '';
    if (hasKeywords) {
      let kwTotal = sub.mcqScore || 0;
      const parts = qs.map(q => {
        const r = preScoreByKeywords(sub.essayAnswers[q.id] || '', q.keywords || [], q.keywordsRequired || 0, q.points || 0);
        if (!r) return `<span style="color:var(--text-muted);">—</span>`;
        kwTotal += r.score;
        const ok = r.found.length >= (q.keywordsRequired || 0);
        return `<span title="Found: ${r.found.join(', ') || 'none'}" style="cursor:help;color:${ok ? 'var(--success)' : 'var(--text-muted)'};">${r.score}</span>`;
      });
      kwCell = `<td style="text-align:center;font-size:0.82rem;">${parts.join(' / ')} = <strong>${kwTotal}</strong></td>`;
    }

    return `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:8px 10px;font-size:0.82rem;">${un}${ud.fullName ? `<br><span style="color:var(--text-muted);font-size:0.72rem;">${ud.fullName}</span>` : ''}</td>
      ${kwCell}
      <td style="text-align:center;padding:8px;">${statusBadge}<br><span style="font-size:0.73rem;color:var(--text-secondary);">${existScore}</span></td>
      <td style="text-align:center;padding:8px;"><button class="btn-xs" onclick="openEssayModal('${un}','${month}')">📝 Grade</button></td>
    </tr>`;
  }).join('');

  const hasTpl = _essayTemplate?.month === month;
  modal.innerHTML = `<div class="modal-box" style="max-width:760px;max-height:88vh;display:flex;flex-direction:column;">
    <h3 style="margin-bottom:4px;">📋 Bulk Essay Grading — ${fmtMonth(month)}</h3>
    <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:14px;">${users.length} submission${users.length !== 1 ? 's' : ''} · ${qs.length} essay Q · ${hasKeywords ? '🔑 Keywords configured' : '<em>No keywords set — ✏️ Edit Questions to configure</em>'}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);align-items:center;">
      ${hasKeywords ? `<button class="btn btn-primary" style="font-size:0.82rem;padding:6px 16px;" onclick="bulkApplyKeywords('${month}')">🔑 Apply Keyword Scores to All Pending</button>` : ''}
      ${hasTpl ? `<button class="btn btn-secondary" style="font-size:0.82rem;padding:6px 16px;" onclick="applyTemplateToAll('${month}')">📋 Apply Saved Template to Pending</button>` : ''}
      ${!hasKeywords && !hasTpl ? `<span style="font-size:0.75rem;color:var(--text-muted);">Grade one user with 📝 Grade → "Save as Template" → come back here to apply to all.</span>` : ''}
    </div>
    <div style="overflow-y:auto;flex:1;">
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="border-bottom:2px solid var(--border);font-size:0.8rem;">
          <th style="text-align:left;padding:6px 10px;">Trainee</th>
          ${kwHeaders}
          <th style="text-align:center;padding:6px 10px;">Status / Score</th>
          <th style="text-align:center;padding:6px 10px;">Action</th>
        </tr></thead>
        <tbody>${userRows}</tbody>
      </table>
    </div>
    <div class="modal-footer" style="margin-top:14px;">
      <button class="btn btn-secondary" onclick="document.getElementById('bulkEssayModal').remove()">Close</button>
    </div>
  </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

function openEssayModal(un, month) {
  const sub = getSubmission(un, month);
  const qb  = getQBank('bdcs');
  const gt  = getGenTest('bdcs', month);
  if (!sub || !sub.essayAnswers) { alert('Submission not found.'); return; }

  document.getElementById('essayModal')?.remove();

  // Build context for AI grading
  _essayCtx = { un, month, mcqScore: sub.mcqScore || 0, essayMap: {} };

  const essays = Object.entries(sub.essayAnswers);

async function aiGradeOne(qid) {
  const key = getGeminiKey();
  if (!key) { alert('Gemini API key not set.\nGo to Admin Panel → Settings to add your key.'); return; }
  const ctx = _essayCtx;
  if (!ctx) return;
  const q = ctx.essayMap[qid];
  if (!q) return;

  const statusEl   = document.getElementById(`ai_status_${qid}`);
  const feedbackEl = document.getElementById(`ai_feedback_${qid}`);
  const scoreEl    = document.getElementById(`essay_score_${qid}`);
  const btnEl      = document.getElementById(`ai_btn_${qid}`);

  statusEl.textContent = '⏳';
  if (btnEl) btnEl.disabled = true;
  feedbackEl.classList.add('hidden');
  feedbackEl.classList.remove('err');

  const prompt = `You are grading a training exam essay for a sales/trading company (WeMasterTrade). Grade the student's answer based on the rubric. The answer may be in English or Vietnamese — assess content, not language.

Question: ${q.text}
Max Points: ${q.maxPts}
${q.rubric ? `Rubric / Criteria:\n${q.rubric}` : '(No rubric provided — grade on overall relevance and accuracy)'}

Student Answer:
${q.ans || '(No answer provided)'}

Respond ONLY with valid JSON (no markdown fences, no extra text):
{"score": <integer 0 to ${q.maxPts}>, "feedback": "<1-2 sentences in English>"}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.1, maxOutputTokens: 300 }
        })
      }
    );
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const data   = await res.json();
    const raw    = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const cleaned = raw.replace(/```json\n?|\n?```/g, '').trim();
    const result  = JSON.parse(cleaned);
    const score   = Math.min(Math.max(Math.round(Number(result.score)), 0), q.maxPts);

    scoreEl.value = score;
    feedbackEl.innerHTML = `<strong style="color:var(--success);">AI Suggested: ${score}/${q.maxPts}pts</strong> — ${result.feedback || ''}`;
    feedbackEl.classList.remove('hidden');
    statusEl.textContent = '✅';
  } catch (e) {
    feedbackEl.innerHTML = `Error: ${e.message}`;
    feedbackEl.classList.add('err');
    feedbackEl.classList.remove('hidden');
    statusEl.textContent = '❌';
  } finally {
    if (btnEl) btnEl.disabled = false;
  }
}

async function aiGradeAll() {
  const key = getGeminiKey();
  if (!key) { alert('Gemini API key not set.\nGo to Admin Panel → Settings to add your key.'); return; }
  const ctx = _essayCtx;
  if (!ctx) return;
  const btn = document.getElementById('aiGradeAllBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Grading…'; }
  for (const qid of Object.keys(ctx.essayMap)) {
    await aiGradeOne(qid);
  }
  if (btn) { btn.disabled = false; btn.textContent = '🤖 Grade All with AI'; }
}

function applyEssayScores() {
  const ctx = _essayCtx;
  if (!ctx) return;
  let essayTotal = 0;
  const essayScores = {};
  for (const qid of Object.keys(ctx.essayMap)) {
    const v = parseFloat(document.getElementById(`essay_score_${qid}`)?.value) || 0;
    essayScores[qid] = v;
    essayTotal += v;
  }
  const total = ctx.mcqScore + essayTotal;
  const cfg      = getMC()[ctx.month] || {};
  const passBDCS = cfg.passBDCS ?? 250;
  const lietMax  = cfg.lietMax  ?? 10;

  // Save essay scores to submission
  const sub = getSubmission(ctx.un, ctx.month);
  if (sub) {
    sub.essayScores = essayScores;
    sub.essayTotal  = essayTotal;
    sub.essayPending = false;
    saveSubmission(ctx.un, ctx.month, sub);
  }

  // Save directly to monthly_scores
  const ms = getMS();
  if (!ms[ctx.month]) ms[ctx.month] = {};
  const liet = ms[ctx.month]?.[ctx.un]?.liet ?? sub?.lietWrong ?? 0;
  ms[ctx.month][ctx.un] = { score: total, liet, passed: total >= passBDCS && liet <= lietMax, gradedAt: new Date().toISOString() };
  saveMS(ms);

  document.getElementById('essayModal')?.remove();
  _essayCtx = null;
  renderScoresTables();
}
