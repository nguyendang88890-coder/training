<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Test | WMT Training</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== TEST PAGE STYLES ===== */
.test-header {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px 28px; margin-bottom: 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 14px; position: sticky; top: 0; z-index: 50;
}
.test-header-info h2 { font-size: 1.1rem; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
.test-header-info p  { font-size: 0.8rem; color: var(--text-muted); margin: 0; }

.test-timer { display: flex; align-items: center; gap: 8px; }
.timer-box  {
  background: rgba(255,61,113,0.08); border: 1px solid rgba(255,61,113,0.25);
  border-radius: 10px; padding: 8px 16px; display: flex; align-items: center; gap: 8px;
}
.timer-box.ok  { background: rgba(0,214,143,0.06); border-color: rgba(0,214,143,0.25); }
.timer-box.warn{ background: rgba(255,165,0,0.08); border-color: rgba(255,165,0,0.3); }
.timer-val { font-size: 1.3rem; font-weight: 800; color: var(--danger); font-variant-numeric: tabular-nums; }
.timer-val.ok   { color: var(--success); }
.timer-val.warn { color: #FFA500; }
.timer-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; }

.progress-bar-wrap { background: var(--bg-secondary); border-radius: 4px; height: 5px; margin-bottom: 20px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #FFA500); border-radius: 4px; transition: width .3s; }

/* Question card */
.q-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 22px 24px; margin-bottom: 16px; transition: border-color .2s;
}
.q-card.answered { border-color: rgba(0,214,143,0.3); }
.q-card.essay-card { border-color: rgba(100,150,255,0.25); }

.q-num { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.q-tag { border-radius: 4px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700; }
.q-tag.mcq   { background: rgba(255,215,0,0.1); color: var(--gold); }
.q-tag.essay { background: rgba(100,150,255,0.12); color: #6496ff; }
.q-tag.liet  { background: rgba(255,61,113,0.1); color: var(--danger); }
.q-tag.pts   { background: rgba(90,90,120,0.15); color: var(--text-muted); }

.q-text { font-size: 0.92rem; color: var(--text-primary); line-height: 1.55; margin-bottom: 16px; font-weight: 500; }

/* MCQ options */
.q-opts { display: flex; flex-direction: column; gap: 8px; }
.q-opt  {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: 9px; cursor: pointer; transition: all .15s;
}
.q-opt:hover { border-color: rgba(255,215,0,0.4); background: rgba(255,215,0,0.03); }
.q-opt.selected { border-color: var(--gold); background: rgba(255,215,0,0.07); }
.q-opt input[type="radio"] { display: none; }
.q-opt-letter {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
  font-weight: 700; color: var(--text-muted); flex-shrink: 0; transition: all .15s;
}
.q-opt.selected .q-opt-letter { border-color: var(--gold); background: rgba(255,215,0,0.15); color: var(--gold); }
.q-opt-text { font-size: 0.88rem; color: var(--text-secondary); }

/* Essay */
.q-essay-area {
  width: 100%; min-height: 140px; padding: 12px 14px; background: var(--bg-primary);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);
  font-size: 0.88rem; line-height: 1.5; resize: vertical; font-family: inherit;
  transition: border-color .15s; box-sizing: border-box;
}
.q-essay-area:focus { outline: none; border-color: #6496ff; }
.q-essay-hint { font-size: 0.73rem; color: var(--text-muted); margin-top: 6px; }

/* Submit zone */
.submit-zone {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px 28px; margin-top: 10px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.submit-info { font-size: 0.84rem; color: var(--text-muted); }
.submit-info strong { color: var(--text-primary); }

/* Result screen */
.result-hero {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 36px 32px; text-align: center; margin-bottom: 24px;
}
.result-icon  { font-size: 3rem; margin-bottom: 12px; }
.result-score { font-size: 3rem; font-weight: 900; color: var(--gold); line-height: 1; }
.result-max   { font-size: 1rem; color: var(--text-muted); font-weight: 400; }
.result-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin: 12px 0 16px; }
.result-badge.pass { background: rgba(0,214,143,0.15); color: var(--success); }
.result-badge.fail { background: rgba(255,61,113,0.1); color: var(--danger); }
.result-details { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.result-detail { background: var(--bg-secondary); border-radius: 10px; padding: 10px 18px; font-size: 0.82rem; }
.result-detail strong { display: block; font-size: 1.2rem; color: var(--text-primary); }
.result-detail span   { color: var(--text-muted); font-size: 0.72rem; }

.answered-count { font-weight: 700; color: var(--text-primary); }
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="top-bar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="top-bar-title" id="pageTitle">Monthly Test</span>
    </div>
    <div class="page-content animate-in" id="pageContent">
      <div class="empty-state" style="padding:60px 24px;color:var(--text-muted);">Loading…</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="module-common.js"></script>
<script>
// ===== DATA HELPERS =====
function getMC()          { return JSON.parse(localStorage.getItem('wmt_monthly_config')||'{}'); }
function getMS()          { return JSON.parse(localStorage.getItem('wmt_monthly_scores')||'{}'); }
function saveMS(d)        { dbWrite('wmt_monthly_scores', JSON.stringify(d)); }
function getQBank(g)         { return JSON.parse(localStorage.getItem('wmt_qbank_'+g)||'null'); }
function getGenTest(g, m)    { return JSON.parse(localStorage.getItem(`wmt_gentest_${g}_${m}`)||'null'); }
function getSubmission(u,m){ return JSON.parse(localStorage.getItem('wmt_sub_'+u+'_'+m)||'null'); }
function saveSubmission(u,m,d){ dbWrite('wmt_sub_'+u+'_'+m, JSON.stringify(d)); }
function getRS(u)           { return JSON.parse(localStorage.getItem('wmt_monthly_reschedule_'+u)||'{}'); }

// isBDCS accepts a user object OR a department string.
// User object: checks testGroup override first, then falls back to department.
// String: checks department name directly (no override possible).
function isBDCS(userOrDept) {
  if (userOrDept && typeof userOrDept === 'object') {
    if (userOrDept.testGroup === 'bdcs')   return true;
    if (userOrDept.testGroup === 'others') return false;
    return _checkDeptBDCS(userOrDept.department);
  }
  return _checkDeptBDCS(userOrDept);
}
function _checkDeptBDCS(dept) {
  if (!dept) return false;
  const d = dept.toLowerCase().trim();
  return d === 'bd' || d.includes('business dev') ||
         d === 'cs' || d.includes('customer serv') ||
         d.includes('sales');
}
function fmtDT(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});
}

// ===== INIT =====
const CUR_USER  = localStorage.getItem('wmt_user') || '';
const ALL_USERS = getUsersDB();
let USER_DATA = ALL_USERS[CUR_USER] || {};
let IS_BDCS   = isBDCS(USER_DATA);
let MY_GROUP  = IS_BDCS ? 'bdcs' : 'others';

let _timer = null;
let _answers = {};   // { qid: 'A' | essay text }
let _currentMonth = null;
let _currentCfg   = null;
let _qbank        = null;
let _startedAt    = null;
let _effectiveDeadline = null;

// Parse ?month= from URL
const urlMonth = new URLSearchParams(location.search).get('month');

document.addEventListener('DOMContentLoaded', async function() {
  if (window.FDB && CUR_USER) {
    try {
      // Step 1: sync user profile first so testGroup is up-to-date before fetching gentest
      await FDB.ref(`users/${CUR_USER}`).once('value').then(s => {
        if (!s.exists()) return;
        const db = getUsersDB();
        db[CUR_USER] = { ...db[CUR_USER], ...s.val() };
        localStorage.setItem('wmt_users_db', JSON.stringify(db));
        USER_DATA = db[CUR_USER];
        IS_BDCS   = isBDCS(USER_DATA);
        MY_GROUP  = IS_BDCS ? 'bdcs' : 'others';
      }).catch(() => {});

      // Step 2: now fetch gentest with the correct (possibly updated) group
      await Promise.all([
        FDB.ref('monthly_config').once('value').then(s => {
          if (s.exists()) localStorage.setItem('wmt_monthly_config', JSON.stringify(s.val()));
        }).catch(()=>{}),
        FDB.ref(`submissions/${CUR_USER}`).once('value').then(s => {
          if (s.exists()) Object.entries(s.val()).forEach(([m,d]) =>
            localStorage.setItem(`wmt_sub_${CUR_USER}_${m}`, JSON.stringify(d)));
        }).catch(()=>{}),
        FDB.ref(urlMonth
          ? `gentest/${MY_GROUP}/${urlMonth}`
          : `gentest/${MY_GROUP}`
        ).once('value').then(s => {
          if (!s.exists()) return;
          if (urlMonth) {
            localStorage.setItem(`wmt_gentest_${MY_GROUP}_${urlMonth}`, JSON.stringify(s.val()));
          } else {
            Object.entries(s.val()).forEach(([m, d]) =>
              localStorage.setItem(`wmt_gentest_${MY_GROUP}_${m}`, JSON.stringify(d)));
          }
        }).catch(()=>{}),
        FDB.ref(`reschedule/${CUR_USER}`).once('value').then(s => {
          if (s.exists()) localStorage.setItem(`wmt_monthly_reschedule_${CUR_USER}`, JSON.stringify(s.val()));
        }).catch(()=>{}),
      ]);
    } catch(e) { console.warn('[taketest] sync:', e.message); }
  }
  if (!CUR_USER) { location.href = 'index.html'; return; }
  if (ALL_USERS[CUR_USER]?.role === 'admin') { location.href = 'monthlytest.html'; return; }

  // Build sidebar
  document.getElementById('sidebar').innerHTML = getSidebarHTML('monthlytest');

  // Find test
  const cfgs = getMC();
  _currentMonth = urlMonth && cfgs[urlMonth] ? urlMonth : findActiveMonth(cfgs);

  // Fallback: if no active window, check if user has a submission for a recent month
  if (!_currentMonth) {
    const sorted = Object.keys(cfgs).sort().reverse();
    for (const m of sorted) {
      const s = getSubmission(CUR_USER, m);
      if (s && s.submittedAt) { _currentMonth = m; break; }
    }
  }

  if (!_currentMonth) {
    renderError('No active test found. Back to <a href="monthlytest.html" style="color:var(--gold)">Monthly Test</a>.');
    return;
  }

  _currentCfg = cfgs[_currentMonth];

  // Load qbank + submission early — can show review even if config failed to load
  _qbank = getGenTest(MY_GROUP, _currentMonth) || getQBank(MY_GROUP);
  const sub = getSubmission(CUR_USER, _currentMonth);
  if (sub && sub.submittedAt) {
    // Resolve deadline from config for correct-answer gating (best-effort)
    if (_currentCfg) {
      const myRS  = getRS(CUR_USER);
      const myRsM = myRS[_currentMonth];
      _effectiveDeadline = (myRsM?.status === 'approved' && myRsM.rsDeadline)
        ? myRsM.rsDeadline
        : (IS_BDCS ? _currentCfg.deadlineBDCS : _currentCfg.deadlineOthers);
    }
    // Backfill questionSnapshot for old submissions that don't have it yet
    if (!sub.questionSnapshot && _qbank && _qbank.questions) {
      const snapshot = {};
      _qbank.questions.forEach(q => {
        snapshot[q.id] = {
          text: q.text, type: q.type, isLiet: !!q.isLiet, points: q.points,
          ...(q.type === 'MCQ' ? { opts: q.opts, correct: q.correct } : {}),
          ...(q.rubric         ? { rubric: q.rubric }                  : {})
        };
      });
      sub.questionSnapshot = snapshot;
      saveSubmission(CUR_USER, _currentMonth, sub);
    }
    renderResult(sub, _currentCfg || {});
    return;
  }

  // --- Below this point: user has NOT submitted yet, needs full config ---
  if (!_currentCfg) {
    renderError('Test configuration not found. Please refresh the page.');
    return;
  }

  // Determine effective test window: personal approved reschedule takes priority
  const myRS   = getRS(CUR_USER);
  const myRsM  = myRS[_currentMonth];
  const hasApprovedRS = myRsM?.status === 'approved' && myRsM.rsDeadline;

  let startD, endD;
  if (hasApprovedRS) {
    startD = myRsM.rsStart || new Date(`${myRsM.newDate}T${myRsM.newTime||'09:00'}`).toISOString();
    endD   = myRsM.rsDeadline;
  } else {
    startD = IS_BDCS ? _currentCfg.startDateBDCS : _currentCfg.startDateOthers;
    endD   = IS_BDCS ? _currentCfg.deadlineBDCS  : _currentCfg.deadlineOthers;
  }

  _effectiveDeadline = endD;
  const now = Date.now();

  if (!startD || !endD) {
    renderError('No test has been configured for your department.');
    return;
  }

  if (now < new Date(startD).getTime()) {
    renderError(`Test has not started yet. Opens at: <strong>${fmtDT(startD)}</strong>`);
    return;
  }
  if (now > new Date(endD).getTime()) {
    renderError('The test period has ended.');
    return;
  }

  if (!_qbank || !_qbank.questions || !_qbank.questions.length) {
    renderError('No test available for your group this month. Please contact admin.');
    return;
  }

  document.getElementById('pageTitle').textContent = _currentCfg.title || 'Monthly Test';
  renderTest(new Date(endD).getTime());
  startGentestListener();
});

// ===== REAL-TIME GENTEST LISTENER =====
let _gentestListenerInitial = true;

function startGentestListener() {
  if (!window.FDB || !_currentMonth || MY_GROUP === undefined) return;
  FDB.ref(`gentest/${MY_GROUP}/${_currentMonth}`).on('value', snap => {
    // First event is the initial load — already have it, skip
    if (_gentestListenerInitial) { _gentestListenerInitial = false; return; }
    if (!snap.exists()) return;
    const fresh = snap.val();
    // Only act if user is still mid-test (not yet submitted)
    if (!document.getElementById('questionsWrap')) return;
    // Skip if nothing actually changed
    if (JSON.stringify(fresh) === JSON.stringify(_qbank)) return;

    localStorage.setItem(`wmt_gentest_${MY_GROUP}_${_currentMonth}`, JSON.stringify(fresh));
    _qbank = fresh;

    // Update each question card in-place — preserves scroll position and answers
    fresh.questions.forEach((q, idx) => {
      const card = document.getElementById(`qcard_${q.id}`);
      if (!card) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderQuestion(q, idx);
      card.replaceWith(tmp.firstElementChild);
      // Re-apply saved answer so selection is not lost
      const saved = _answers[q.id];
      if (saved) {
        if (q.type === 'MCQ') selectOpt(q.id, saved);
        else {
          const ta = document.getElementById(`ans_${q.id}`);
          if (ta) { ta.value = saved; ta.dispatchEvent(new Event('input')); }
        }
      }
    });

    updateProgress();
    showTestUpdateBanner();
  });
}

function showTestUpdateBanner() {
  document.getElementById('testUpdateBanner')?.remove();
  const b = document.createElement('div');
  b.id = 'testUpdateBanner';
  b.style.cssText = `position:fixed;top:72px;left:50%;transform:translateX(-50%);
    background:rgba(100,150,255,0.93);color:#fff;border-radius:10px;
    padding:10px 22px;font-size:0.85rem;font-weight:600;z-index:9999;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);white-space:nowrap;
    transition:opacity 0.4s;`;
  b.textContent = '📢 Admin updated the test — changes applied';
  document.body.appendChild(b);
  setTimeout(() => { b.style.opacity = '0'; }, 3500);
  setTimeout(() => b.remove(), 4000);
}

function findActiveMonth(cfgs) {
  const months = Object.keys(cfgs).sort().reverse();
  const now = Date.now();
  const myRS = getRS(CUR_USER);

  for (const m of months) {
    const c = cfgs[m];

    // Check personal approved reschedule window first
    const rs = myRS[m];
    if (rs?.status === 'approved' && rs.rsDeadline) {
      const rsStart = rs.rsStart || new Date(`${rs.newDate}T${rs.newTime||'09:00'}`).toISOString();
      if (now >= new Date(rsStart).getTime() && now <= new Date(rs.rsDeadline).getTime()) return m;
    }

    // Fall back to global group window
    const s = IS_BDCS ? c.startDateBDCS : c.startDateOthers;
    const e = IS_BDCS ? c.deadlineBDCS  : c.deadlineOthers;
    if (s && e && now >= new Date(s).getTime() && now <= new Date(e).getTime()) return m;
  }
  return null;
}

// ===== RENDER TEST =====
function renderTest(deadlineTs) {
  const qs = _qbank.questions;
  const mc = _currentCfg;

  const html = `
    <div class="test-header" id="testHeader">
      <div class="test-header-info">
        <h2>${mc.title || 'Monthly Test'}</h2>
        <p>${_qbank.questions.length} questions &nbsp;·&nbsp; Total ${_qbank.totalPoints} pts
          ${IS_BDCS ? '&nbsp;·&nbsp; Pass: '+(mc.passBDCS??250)+'/300, Max Liet: '+(mc.lietMax??2) : '&nbsp;·&nbsp; Pass: '+(mc.passOthers??70)+'/100'}
        </p>
      </div>
      <div class="test-timer">
        <div class="timer-box ok" id="timerBox">
          <div>
            <div class="timer-lbl">⏰ Remaining</div>
            <div class="timer-val ok" id="timerVal">--:--:--</div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>

    <div id="questionsWrap">
      ${qs.map((q, idx) => renderQuestion(q, idx)).join('')}
    </div>

    <div class="submit-zone">
      <div class="submit-info">
        Answered: <span class="answered-count" id="answeredCount">0</span> / ${qs.length} questions
        ${IS_BDCS ? '<br><span style="font-size:0.78rem;color:var(--text-muted);">Essay questions will be graded by admin later.</span>' : ''}
      </div>
      <button class="btn btn-primary" onclick="submitTest()" style="padding:12px 32px;font-size:0.95rem;">
        📤 Submit
      </button>
    </div>`;

  document.getElementById('pageContent').innerHTML = html;
  _startedAt = new Date().toISOString();
  startTimer(deadlineTs);
  updateProgress();
}

function renderQuestion(q, idx) {
  if (q.type === 'Essay') {
    return `<div class="q-card essay-card" id="qcard_${q.id}">
      <div class="q-num">
        Question ${idx+1}
        <span class="q-tag essay">Essay</span>
        ${q.isLiet ? '<span class="q-tag liet">⚠ Liet Points</span>' : ''}
        <span class="q-tag pts">${q.points}pts</span>
      </div>
      <div class="q-text">${q.text}</div>
      ${q.rubric ? `<div style="background:rgba(100,150,255,0.05);border:1px solid rgba(100,150,255,0.15);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.78rem;color:var(--text-muted);">
        📋 Answer Guide: ${q.rubric}</div>` : ''}
      <textarea class="q-essay-area" id="ans_${q.id}" placeholder="Enter your answer here..."
        oninput="onEssayInput(${q.id}, this.value)"></textarea>
      <div class="q-essay-hint">Write a clear and complete answer. Your response will be reviewed and graded by admin.</div>
    </div>`;
  }

  // MCQ
  const opts = Object.entries(q.opts || {}).filter(([,v])=>v);
  return `<div class="q-card" id="qcard_${q.id}">
    <div class="q-num">
      Question ${idx+1}
      <span class="q-tag mcq">Multiple Choice</span>
      ${q.isLiet ? '<span class="q-tag liet">⚠ Liet Points</span>' : ''}
      <span class="q-tag pts">${q.points}pts</span>
    </div>
    <div class="q-text">${q.text}</div>
    <div class="q-opts">
      ${opts.map(([letter, text]) => `
        <label class="q-opt" id="opt_${q.id}_${letter}" onclick="selectOpt(${q.id},'${letter}')">
          <input type="radio" name="q_${q.id}" value="${letter}">
          <div class="q-opt-letter">${letter}</div>
          <div class="q-opt-text">${text}</div>
        </label>`).join('')}
    </div>
  </div>`;
}

function selectOpt(qid, letter) {
  _answers[qid] = letter;
  // Update visual
  const q = _qbank.questions.find(q=>q.id===qid);
  if (!q) return;
  Object.keys(q.opts).forEach(l => {
    const el = document.getElementById(`opt_${qid}_${l}`);
    if (el) el.classList.toggle('selected', l===letter);
  });
  document.getElementById(`qcard_${qid}`)?.classList.add('answered');
  updateProgress();
}

function onEssayInput(qid, val) {
  _answers[qid] = val;
  const card = document.getElementById(`qcard_${qid}`);
  if (card) card.classList.toggle('answered', val.trim().length > 0);
  updateProgress();
}

function updateProgress() {
  const qs  = _qbank.questions;
  const answered = qs.filter(q => {
    const a = _answers[q.id];
    return q.type === 'MCQ' ? !!a : (a && a.trim().length > 0);
  }).length;
  const pct = qs.length > 0 ? Math.round(answered / qs.length * 100) : 0;
  const fill = document.getElementById('progressFill');
  const cnt  = document.getElementById('answeredCount');
  if (fill) fill.style.width = pct + '%';
  if (cnt)  cnt.textContent  = answered;
}

// ===== TIMER =====
function startTimer(deadlineTs) {
  function tick() {
    const diff = deadlineTs - Date.now();
    const box = document.getElementById('timerBox');
    const val = document.getElementById('timerVal');
    if (!box || !val) { clearInterval(_timer); return; }
    if (diff <= 0) {
      clearInterval(_timer);
      val.textContent = '00:00:00';
      autoSubmit();
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor(diff % 3600000 / 60000);
    const s = Math.floor(diff % 60000 / 1000);
    val.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const cls = diff < 300000 ? 'warn' : diff < 3600000 ? '' : 'ok';
    val.className  = 'timer-val ' + cls;
    box.className  = 'timer-box ' + cls;
  }
  tick();
  _timer = setInterval(tick, 1000);
}

// ===== SUBMIT =====
function autoSubmit() {
  alert('⏰ Time\'s up! Your test will be submitted automatically.');
  doSubmit(true);
}

function submitTest() {
  const qs  = _qbank.questions;
  const mcq = qs.filter(q=>q.type==='MCQ');
  const unansweredMCQ = mcq.filter(q=>!_answers[q.id]);

  if (unansweredMCQ.length > 0) {
    const proceed = confirm(`You have ${unansweredMCQ.length} unanswered multiple-choice questions.\n\nDo you want to submit?`);
    if (!proceed) return;
  } else {
    if (!confirm('Confirm submission? You will not be able to edit after submitting.')) return;
  }
  doSubmit(false);
}

async function doSubmit(auto) {
  clearInterval(_timer);

  // Re-fetch the latest gentest from Firebase before grading.
  // This ensures admin edits to correct answers (made after the user loaded the page)
  // are applied to this submission, not the stale cached version.
  if (window.FDB) {
    try {
      const snap = await FDB.ref(`gentest/${MY_GROUP}/${_currentMonth}`).once('value');
      if (snap.exists()) {
        const fresh = snap.val();
        localStorage.setItem(`wmt_gentest_${MY_GROUP}_${_currentMonth}`, JSON.stringify(fresh));
        _qbank = fresh;
      }
    } catch(e) { /* keep existing _qbank on network error */ }
  }

  const qs = _qbank.questions;
  const mc = _currentCfg;

  // Grade MCQ
  let mcqScore = 0, lietWrong = 0;
  const mcqResults = {};
  qs.forEach(q => {
    if (q.type !== 'MCQ') return;
    const ans = _answers[q.id];
    const correct = ans && q.correct && ans.toUpperCase() === q.correct.toUpperCase();
    mcqResults[q.id] = { ans: ans||null, correct };
    if (correct) mcqScore += q.points;
    else if (q.isLiet) lietWrong++;
  });

  // Essay answers
  const essayAnswers = {};
  qs.forEach(q => {
    if (q.type === 'Essay') essayAnswers[q.id] = _answers[q.id] || '';
  });
  const hasEssay = Object.keys(essayAnswers).length > 0;

  // Determine provisional pass for MCQ-only (Others)
  let provisionalPassed = null;
  if (!IS_BDCS) {
    const passOthers = mc.passOthers ?? 70;
    provisionalPassed = mcqScore >= passOthers;
  }
  // For BD/CS: pass determined after essay grading — save as pending

  // Compact snapshot of question texts/options — used when gentest is no longer cached
  const questionSnapshot = {};
  qs.forEach(q => {
    questionSnapshot[q.id] = {
      text: q.text, type: q.type, isLiet: !!q.isLiet, points: q.points,
      ...(q.type === 'MCQ' ? { opts: q.opts, correct: q.correct } : {}),
      ...(q.rubric         ? { rubric: q.rubric }                  : {})
    };
  });

  const now = new Date().toISOString();
  const submission = {
    startedAt:        _startedAt || now,
    submittedAt:      now,
    month:            _currentMonth,
    group:            MY_GROUP,
    mcqScore,
    lietWrong,
    essayAnswers,
    mcqResults,
    questionSnapshot,
    essayPending:     hasEssay,
    provisionalPassed
  };
  saveSubmission(CUR_USER, _currentMonth, submission);

  // Auto-populate MCQ score in monthly scores (Others only, BD/CS waits for essay)
  if (!IS_BDCS) {
    const passOthers = mc.passOthers ?? 70;
    const allScores = getMS();
    if (!allScores[_currentMonth]) allScores[_currentMonth] = {};
    allScores[_currentMonth][CUR_USER] = {
      score:   mcqScore,
      passed:  mcqScore >= passOthers,
      gradedAt: new Date().toISOString(),
      autoGraded: true
    };
    saveMS(allScores);
  }

  renderResult(submission, mc);
}

// ===== RESULT SCREEN =====
function renderResult(sub, mc = {}) {
  clearInterval(_timer);
  // Prefer live gentest; fall back to snapshot stored in the submission at submit time
  let qs = _qbank ? _qbank.questions : [];
  if (!qs.length && sub.questionSnapshot) {
    qs = Object.entries(sub.questionSnapshot)
      .map(([id, q]) => ({ id, ...q }))
      .sort((a, b) => (a.type === b.type ? 0 : a.type === 'MCQ' ? -1 : 1));
  }
  const isBDCSU     = sub.group === 'bdcs';
  const maxScore    = isBDCSU ? 300 : 100;
  const lietMax     = mc.lietMax ?? 2;
  const deadlinePassed = _effectiveDeadline && Date.now() > new Date(_effectiveDeadline).getTime();

  let statusHTML = '';
  if (isBDCSU && sub.essayPending) {
    statusHTML = `<div class="result-badge" style="background:rgba(255,165,0,0.1);color:#FFA500;">⏳ Awaiting essay grading</div>
      <p style="color:var(--text-muted);font-size:0.84rem;margin-top:4px;">
        MCQ Score: <strong style="color:var(--gold)">${sub.mcqScore}</strong> pts.<br>
        Admin will grade the essay section and update your final score.
      </p>`;
  } else {
    const passed = sub.provisionalPassed;
    statusHTML = `<div class="result-badge ${passed?'pass':'fail'}">${passed?'✓ PASS':'✗ FAIL'}</div>`;
  }

  const mcqCount   = qs.filter(q=>q.type==='MCQ').length;
  const essayCount = qs.filter(q=>q.type==='Essay').length;
  const correctMCQ = sub.mcqResults ? Object.values(sub.mcqResults).filter(r=>r.correct).length : '—';

  document.getElementById('pageTitle').textContent = 'Test Results';
  document.getElementById('pageContent').innerHTML = `
    <div class="result-hero">
      <div class="result-icon">${isBDCSU&&sub.essayPending ? '📝' : (sub.provisionalPassed?'🏆':'📋')}</div>
      <div class="result-score">${sub.mcqScore}<span class="result-max">/${maxScore}${isBDCSU&&sub.essayPending?' (MCQ)':''}</span></div>
      ${statusHTML}
      <div class="result-details">
        <div class="result-detail"><strong>${correctMCQ}/${mcqCount}</strong><span>MCQ Correct</span></div>
        ${isBDCSU ? `<div class="result-detail"><strong style="color:${sub.lietWrong>lietMax?'var(--danger)':'var(--success)'}">${sub.lietWrong}</strong><span>Liet Wrong (max ${lietMax})</span></div>` : ''}
        ${essayCount > 0 ? `<div class="result-detail"><strong style="color:#6496ff">${essayCount}</strong><span>Essay Questions</span></div>` : ''}
        <div class="result-detail"><strong>${new Date(sub.submittedAt).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit'})}</strong><span>Submitted at</span></div>
      </div>
    </div>

    ${qs.length ? `
    <!-- ===== ANSWER REVIEW ===== -->
    <div style="margin-top:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <div style="font-size:1rem;font-weight:700;color:var(--text-primary);">📋 Review Your Answers</div>
        ${!deadlinePassed ? `
        <div style="font-size:0.78rem;color:#FFA500;background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.25);border-radius:8px;padding:5px 12px;">
          🔒 Correct answers revealed after: <strong>${fmtDT(_effectiveDeadline)}</strong>
        </div>` : `
        <div style="font-size:0.78rem;color:var(--success);background:rgba(0,214,143,0.07);border:1px solid rgba(0,214,143,0.2);border-radius:8px;padding:5px 12px;">
          ✅ Test period ended — correct answers are now shown
        </div>`}
      </div>

      <!-- MCQ review -->
      ${qs.filter(q=>q.type==='MCQ').length ? `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;color:var(--text-primary);font-size:0.9rem;">
          Multiple Choice Questions
        </div>
        ${qs.filter(q=>q.type==='MCQ').map((q,idx)=>{
          const res     = sub.mcqResults ? sub.mcqResults[q.id] : null;
          const chosen  = res?.ans?.toUpperCase() || null;
          const correct = q.correct?.toUpperCase();
          const isCorr  = res?.correct;
          const opts    = ['A','B','C','D'];
          return `<div style="padding:14px 18px;border-top:${idx>0?'1px solid var(--border)':'none'};${q.isLiet?'border-left:3px solid var(--danger);':''}">
            <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
              <span style="font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;
                background:${isCorr?'rgba(0,214,143,0.12)':'rgba(255,61,113,0.1)'};
                color:${isCorr?'var(--success)':'var(--danger)'}">
                ${isCorr?'✓ Correct':'✗ Wrong'}
              </span>
              ${q.isLiet?`<span style="font-size:0.68rem;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(255,61,113,0.1);color:var(--danger);flex-shrink:0;">⚠ Liet</span>`:''}
              <span style="font-size:0.85rem;color:var(--text-primary);line-height:1.4;">${q.text}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;padding-left:4px;">
              ${opts.map(o=>{
                const optText  = q.opts?.[o];
                if (!optText) return '';
                const isChosen  = chosen === o;
                const isCorrect = correct === o;
                let bg='transparent', bdr='rgba(255,255,255,0.05)', col='var(--text-secondary)';
                if (deadlinePassed) {
                  if (isCorrect && isChosen)  { bg='rgba(0,214,143,0.12)'; bdr='rgba(0,214,143,0.4)';  col='var(--success)'; }
                  else if (isCorrect)          { bg='rgba(0,214,143,0.08)'; bdr='rgba(0,214,143,0.3)';  col='var(--success)'; }
                  else if (isChosen)           { bg='rgba(255,61,113,0.07)';bdr='rgba(255,61,113,0.3)'; col='var(--danger)'; }
                } else {
                  if (isChosen && isCorr)      { bg='rgba(0,214,143,0.08)'; bdr='rgba(0,214,143,0.3)';  col='var(--success)'; }
                  else if (isChosen)           { bg='rgba(255,61,113,0.07)';bdr='rgba(255,61,113,0.3)'; col='var(--danger)'; }
                }
                const chosenLabel = deadlinePassed
                  ? (isCorrect ? '✓ Your answer' : '✗ Your answer')
                  : (isCorr    ? '✓ Your answer' : '✗ Your answer');
                const chosenColor = deadlinePassed
                  ? (isCorrect ? 'var(--success)' : 'var(--danger)')
                  : (isCorr    ? 'var(--success)' : 'var(--danger)');
                return `<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;border:1px solid ${bdr};background:${bg};">
                  <span style="font-weight:700;font-size:0.78rem;color:${col};min-width:16px;">${o}.</span>
                  <span style="font-size:0.83rem;color:${col};">${optText}</span>
                  ${isChosen ? `<span style="margin-left:auto;font-size:0.72rem;color:${chosenColor};">${chosenLabel}</span>` : ''}
                  ${deadlinePassed && !isChosen && isCorrect ? `<span style="margin-left:auto;font-size:0.72rem;color:var(--success);">✓ Correct answer</span>` : ''}
                </div>`;
              }).join('')}
              ${!chosen?`<div style="font-size:0.78rem;color:var(--text-muted);padding:3px 10px;">⚠ Not answered</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}

      <!-- Essay review -->
      ${qs.filter(q=>q.type==='Essay').length ? `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;color:#6496ff;font-size:0.9rem;">
          📝 Essay Answers ${isBDCSU&&sub.essayPending?'<span style="font-size:0.72rem;font-weight:500;color:var(--text-muted);margin-left:8px;">(Pending admin grading)</span>':''}
        </div>
        ${qs.filter(q=>q.type==='Essay').map((q,idx)=>{
          const ans = sub.essayAnswers?.[q.id] || '';
          return `<div style="padding:16px 18px;${idx>0?'border-top:1px solid var(--border)':''}">
            <div style="font-size:0.85rem;font-weight:600;color:var(--text-primary);margin-bottom:6px;">${q.text}</div>
            ${q.rubric ? `<div style="font-size:0.75rem;background:rgba(0,214,143,0.06);border:1px solid rgba(0,214,143,0.2);border-radius:7px;padding:7px 10px;color:var(--success);margin-bottom:8px;">📋 Answer Guide: ${q.rubric}</div>` : ''}
            <div style="background:var(--bg-secondary);border-radius:8px;padding:10px 14px;font-size:0.84rem;color:var(--text-secondary);white-space:pre-wrap;min-height:40px;">${ans||'<em style="color:var(--text-muted)">(No answer provided)</em>'}</div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>` : ''}

    <div style="text-align:center;margin-top:10px;">
      <a href="monthlytest.html" class="btn btn-secondary" style="text-decoration:none;padding:10px 24px;">
        ← Back to Monthly Test
      </a>
    </div>`;
}

function renderError(msg) {
  document.getElementById('pageContent').innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:40px 32px;text-align:center;">
      <div style="font-size:2.5rem;margin-bottom:14px;">🔒</div>
      <div style="color:var(--text-secondary);font-size:0.95rem;line-height:1.6;">${msg}</div>
      <a href="monthlytest.html" class="btn btn-secondary" style="text-decoration:none;margin-top:20px;display:inline-block;padding:10px 24px;">
        ← Back to Monthly Test
      </a>
    </div>`;
}
</script>
