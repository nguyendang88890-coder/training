<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Evaluation | WMT Training</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .eval-hero {
      background: linear-gradient(135deg, rgba(100,150,255,0.08), rgba(100,150,255,0.02));
      border: 1px solid rgba(100,150,255,0.25);
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eval-hero-icon { font-size: 2.5rem; flex-shrink: 0; }
    .eval-hero h2  { font-size: 1.4rem; color: #6496ff; margin-bottom: 6px; }
    .eval-hero p   { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.5; }

    .eval-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 16px;
    }
    .eval-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Star rating */
    .star-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .star-label {
      font-size: 0.84rem;
      color: var(--text-secondary);
      flex: 1;
      min-width: 180px;
    }
    .stars {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .star {
      font-size: 1.5rem;
      cursor: pointer;
      color: #333;
      transition: color .1s, transform .1s;
      user-select: none;
      line-height: 1;
    }
    .star.filled  { color: #FFD700; }
    .star.hovered { color: #FFD700; transform: scale(1.15); }
    .star:hover   { transform: scale(1.15); }

    /* Difficulty / yes-no toggle */
    .pill-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .pill {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .15s;
    }
    .pill.selected {
      border-color: #6496ff;
      background: rgba(100,150,255,0.12);
      color: #6496ff;
      font-weight: 600;
    }
    .pill:hover:not(.selected) {
      border-color: rgba(100,150,255,0.4);
      color: var(--text-primary);
    }

    textarea.eval-text {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 10px 14px;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 80px;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color .15s;
    }
    textarea.eval-text:focus { outline: none; border-color: #6496ff; }

    .required-note {
      background: rgba(255,165,0,0.08);
      border: 1px solid rgba(255,165,0,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.83rem;
      color: #FFA500;
      margin-bottom: 20px;
    }

    .submitted-card {
      background: rgba(0,214,143,0.06);
      border: 1px solid rgba(0,214,143,0.25);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="top-bar-title">Training Evaluation</span>
      <div class="top-bar-actions">
        <a href="index.html" class="btn btn-secondary" style="padding:6px 14px;font-size:0.82rem;">← Dashboard</a>
      </div>
    </div>

    <div class="page-content animate-in" id="pageContent">
      <div style="text-align:center;padding:60px 0;color:var(--text-muted);">Loading...</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sidebar.js"></script>
<script>
const CUR_USER  = localStorage.getItem('wmt_user');
const ALL_USERS = JSON.parse(localStorage.getItem('wmt_users_db') || '{}');

if (!CUR_USER || !ALL_USERS[CUR_USER]) { location.href = 'index.html'; }

// ── Data helpers ───────────────────────────────────────────────────
function getEval()    { return JSON.parse(localStorage.getItem('wmt_eval_' + CUR_USER) || 'null'); }
function saveEval(d)  { dbWrite('wmt_eval_' + CUR_USER, JSON.stringify(d)); }
function getExam()    { return JSON.parse(localStorage.getItem('wmt_exam_' + CUR_USER) || '{}'); }
function getInterview(){ return JSON.parse(localStorage.getItem('wmt_interview_' + CUR_USER) || 'null'); }

// ── State for ratings ──────────────────────────────────────────────
const RATINGS = {
  contentClarity: 0,
  contentUsefulness: 0,
  contentStructure: 0,
  trainerKnowledge: 0,
  trainerCommunication: 0,
  trainerSupport: 0,
  overallSatisfaction: 0,
};
let DIFFICULTY    = '';
let RECOMMEND     = '';

// ── Star widget ────────────────────────────────────────────────────
function buildStarRow(key, label) {
  return `
    <div class="star-row">
      <span class="star-label">${label}</span>
      <div class="stars" id="stars_${key}">
        ${[1,2,3,4,5].map(n =>
          `<span class="star" data-key="${key}" data-val="${n}" onclick="setStar('${key}',${n})"
            onmouseenter="hoverStar('${key}',${n})" onmouseleave="unHoverStar('${key}')">★</span>`
        ).join('')}
      </div>
    </div>`;
}

function setStar(key, val) {
  RATINGS[key] = val;
  renderStars(key);
}

function hoverStar(key, val) {
  document.querySelectorAll(`#stars_${key} .star`).forEach(s => {
    const n = +s.dataset.val;
    s.classList.toggle('hovered', n <= val);
  });
}

function unHoverStar(key) {
  document.querySelectorAll(`#stars_${key} .star`).forEach(s => s.classList.remove('hovered'));
}

function renderStars(key) {
  const val = RATINGS[key];
  document.querySelectorAll(`#stars_${key} .star`).forEach(s => {
    s.classList.toggle('filled', +s.dataset.val <= val);
  });
}

function renderAllStars() {
  Object.keys(RATINGS).forEach(renderStars);
}

// ── Pill select ────────────────────────────────────────────────────
function selectPill(group, val) {
  document.querySelectorAll(`.pill[data-group="${group}"]`).forEach(p => {
    p.classList.toggle('selected', p.dataset.val === val);
  });
  if (group === 'difficulty') DIFFICULTY = val;
  if (group === 'recommend')  RECOMMEND  = val;
}

// ── Render ─────────────────────────────────────────────────────────
function renderPage() {
  document.getElementById('sidebar').innerHTML = getSidebarHTML('');

  const exam      = getExam();
  const interview = getInterview();
  const evalData  = getEval();
  const el        = document.getElementById('pageContent');

  // Check eligibility
  if (!exam.passed) {
    el.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:48px 32px;text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:14px;">🔒</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">Evaluation Locked</div>
        <div style="color:var(--text-muted);font-size:0.9rem;">You need to pass the Final Exam before accessing the evaluation.</div>
        <a href="exam.html" class="btn btn-primary" style="display:inline-flex;margin-top:20px;width:auto;">Go to Final Exam →</a>
      </div>`;
    return;
  }

  if (!interview || interview.status !== 'completed') {
    el.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:48px 32px;text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:14px;">🔒</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">Evaluation Locked</div>
        <div style="color:var(--text-muted);font-size:0.9rem;">The evaluation will be available after your interview has been marked as completed by the admin.</div>
        <a href="interview.html" class="btn btn-secondary" style="display:inline-flex;margin-top:20px;width:auto;">View Interview Status →</a>
      </div>`;
    return;
  }

  // Already submitted
  if (evalData && evalData.submittedAt) {
    const avg = (Object.values({
      contentClarity: evalData.contentClarity,
      contentUsefulness: evalData.contentUsefulness,
      contentStructure: evalData.contentStructure,
      trainerKnowledge: evalData.trainerKnowledge,
      trainerCommunication: evalData.trainerCommunication,
      trainerSupport: evalData.trainerSupport,
      overallSatisfaction: evalData.overallSatisfaction,
    }).reduce((a, b) => a + b, 0) / 7).toFixed(1);

    el.innerHTML = `
      <div class="submitted-card">
        <div style="font-size:3rem;margin-bottom:14px;">🎉</div>
        <div style="font-size:1.3rem;font-weight:800;color:var(--success);margin-bottom:8px;">Thank You for Your Feedback!</div>
        <div style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:24px;">
          Your evaluation has been submitted and helps us improve the training programme.
        </div>
        <div style="display:inline-flex;gap:32px;background:rgba(0,214,143,0.06);border:1px solid rgba(0,214,143,0.2);border-radius:12px;padding:18px 32px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;">
          <div style="text-align:center;">
            <div style="font-size:1.8rem;font-weight:800;color:var(--gold)">${avg}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px;">Avg Rating</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.8rem;font-weight:800;color:#6496ff">${evalData.recommend === 'yes' ? '✓ Yes' : '✗ No'}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px;">Would Recommend</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:0.78rem;color:var(--text-muted);">Submitted</div>
            <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:2px;">${new Date(evalData.submittedAt).toLocaleString('en-GB')}</div>
          </div>
        </div>
        <div style="margin-top:8px;">
          <a href="index.html" class="btn btn-secondary" style="display:inline-flex;width:auto;text-decoration:none;">← Back to Dashboard</a>
        </div>
      </div>`;
    return;
  }

  // Show form
  el.innerHTML = `
    <div class="eval-hero">
      <div class="eval-hero-icon">📋</div>
      <div>
        <h2>Training Evaluation</h2>
        <p>Please take a moment to evaluate the training content and your trainer. Your feedback is mandatory to complete the onboarding process and helps us continuously improve.</p>
      </div>
    </div>

    <div class="required-note">
      ⚠️ <strong>Required:</strong> This evaluation must be completed to finalise your onboarding. Your responses are anonymous to other trainees.
    </div>

    <!-- Training Content -->
    <div class="eval-section">
      <div class="eval-section-title">📚 Training Content</div>
      ${buildStarRow('contentClarity', 'Clarity — How easy was the material to understand?')}
      ${buildStarRow('contentUsefulness', 'Usefulness — How relevant is the content to your role?')}
      ${buildStarRow('contentStructure', 'Structure — How well-organised was the training?')}
      <div style="margin-top:4px;">
        <div class="star-label" style="margin-bottom:8px;">Difficulty level</div>
        <div class="pill-group">
          <button class="pill" data-group="difficulty" data-val="too_easy"   onclick="selectPill('difficulty','too_easy')">Too Easy</button>
          <button class="pill" data-group="difficulty" data-val="just_right" onclick="selectPill('difficulty','just_right')">Just Right</button>
          <button class="pill" data-group="difficulty" data-val="too_hard"   onclick="selectPill('difficulty','too_hard')">Too Hard</button>
        </div>
      </div>
    </div>

    <!-- Trainer -->
    <div class="eval-section">
      <div class="eval-section-title">🎓 Trainer Evaluation</div>
      ${buildStarRow('trainerKnowledge', 'Knowledge — How knowledgeable was your trainer?')}
      ${buildStarRow('trainerCommunication', 'Communication — How clearly did the trainer explain things?')}
      ${buildStarRow('trainerSupport', 'Support — How responsive and helpful was the trainer?')}
    </div>

    <!-- Overall -->
    <div class="eval-section">
      <div class="eval-section-title">⭐ Overall</div>
      ${buildStarRow('overallSatisfaction', 'Overall satisfaction with the training programme')}
      <div style="margin-top:4px;">
        <div class="star-label" style="margin-bottom:8px;">Would you recommend this training to a colleague?</div>
        <div class="pill-group">
          <button class="pill" data-group="recommend" data-val="yes" onclick="selectPill('recommend','yes')">✓ Yes</button>
          <button class="pill" data-group="recommend" data-val="no"  onclick="selectPill('recommend','no')">✗ No</button>
        </div>
      </div>
    </div>

    <!-- Open feedback -->
    <div class="eval-section">
      <div class="eval-section-title">💬 Open Feedback</div>
      <div style="margin-bottom:14px;">
        <div class="star-label" style="margin-bottom:6px;">What did you find most valuable about the training?</div>
        <textarea class="eval-text" id="evalBestPart" placeholder="e.g. The module on Trading Rules was very clear and practical..."></textarea>
      </div>
      <div>
        <div class="star-label" style="margin-bottom:6px;">What could be improved?</div>
        <textarea class="eval-text" id="evalImprove" placeholder="e.g. More real-world examples in Module 4 would help..."></textarea>
      </div>
    </div>

    <div id="evalError" style="color:var(--danger);font-size:0.84rem;margin-bottom:12px;display:none;"></div>
    <button class="btn btn-primary" onclick="submitEval()" style="width:100%;padding:14px;">
      ✅ Submit Evaluation
    </button>
    <div style="text-align:center;margin-top:10px;">
      <a href="index.html" style="font-size:0.8rem;color:var(--text-muted);text-decoration:none;">← Back to Dashboard</a>
    </div>
  `;

  renderAllStars();
}

// ── Submit ─────────────────────────────────────────────────────────
function submitEval() {
  const errEl = document.getElementById('evalError');
  errEl.style.display = 'none';

  // Validate all star ratings filled
  const missingStars = Object.entries(RATINGS).find(([, v]) => v === 0);
  if (missingStars) {
    errEl.textContent = 'Please rate all categories before submitting.';
    errEl.style.display = 'block';
    errEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (!DIFFICULTY) {
    errEl.textContent = 'Please select the difficulty level.';
    errEl.style.display = 'block';
    return;
  }
  if (!RECOMMEND) {
    errEl.textContent = 'Please answer whether you would recommend this training.';
    errEl.style.display = 'block';
    return;
  }

  const data = {
    username: CUR_USER,
    submittedAt: new Date().toISOString(),
    ...RATINGS,
    difficulty: DIFFICULTY,
    recommend: RECOMMEND,
    bestPart:  (document.getElementById('evalBestPart')?.value || '').trim(),
    improvements: (document.getElementById('evalImprove')?.value || '').trim(),
  };

  saveEval(data);
  renderPage();
}

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async function() {
  // Sync from Firebase first
  if (window.FDB && CUR_USER) {
    await Promise.all([
      FDB.ref(`exam/${CUR_USER}`).once('value').then(s => {
        if (s.exists()) localStorage.setItem('wmt_exam_' + CUR_USER, JSON.stringify(s.val()));
      }).catch(() => {}),
      FDB.ref(`interview/${CUR_USER}`).once('value').then(s => {
        if (s.exists()) localStorage.setItem('wmt_interview_' + CUR_USER, JSON.stringify(s.val()));
      }).catch(() => {}),
      FDB.ref(`evaluations/${CUR_USER}`).once('value').then(s => {
        if (s.exists()) localStorage.setItem('wmt_eval_' + CUR_USER, JSON.stringify(s.val()));
      }).catch(() => {}),
    ]).catch(() => {});
  }
  renderPage();
});
</script>
</body>
</html>
