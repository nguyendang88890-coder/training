<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User — WeMasterTrade Training</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0a16;color:#e0e0e0;min-height:100vh;padding:40px 20px}
.container{max-width:1200px;margin:0 auto}h1{color:#FFD700;font-size:28px;margin-bottom:24px;text-align:center}
.content-wrapper{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.form-section{background:#1a1a24;border:1px solid #FFD700;border-radius:8px;padding:30px}
.form-section h2{color:#FFD700;font-size:20px;margin-bottom:20px}
.form-group{margin-bottom:18px}
.form-group label{display:block;color:#e0e0e0;margin-bottom:8px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:#0a0a16;border:1px solid #444;border-radius:4px;color:#e0e0e0;font-size:14px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#FFD700;box-shadow:0 0 8px rgba(255,215,0,0.3)}
.password-group{position:relative}
.password-toggle{position:absolute;right:12px;top:38px;background:none;border:none;color:#FFD700;cursor:pointer;font-size:16px;padding:0}
.password-toggle:hover{color:#FFC700}
.btn-submit{width:100%;padding:12px;background:#FFD700;color:#0a0a16;border:none;border-radius:4px;font-weight:600;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-submit:hover{background:#FFC700;transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,215,0,0.3)}
.list-section{background:#1a1a24;border:1px solid #FFD700;border-radius:8px;padding:30px}
.list-section h2{color:#FFD700;font-size:20px;margin-bottom:20px}
.user-table{width:100%;border-collapse:collapse}
.user-table thead{background:#0a0a16}
.user-table th{color:#FFD700;padding:12px;text-align:left;border-bottom:2px solid #FFD700;font-weight:600}
.user-table td{padding:12px;border-bottom:1px solid #333;color:#e0e0e0}
.user-table tbody tr:hover{background:#252530}
.user-table .action-btn{padding:6px 12px;margin-right:8px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.3s}
.btn-edit{background:#4CAF50;color:white}
.btn-edit:hover{background:#45a049;box-shadow:0 2px 8px rgba(76,175,80,0.3)}
.btn-delete{background:#f44336;color:white}
.btn-delete:hover{background:#da190b;box-shadow:0 2px 8px rgba(244,67,54,0.3)}
.btn-reset-password{background:#2196F3;color:white}
.btn-reset-password:hover{background:#0b7dda;box-shadow:0 2px 8px rgba(33,150,243,0.3)}
.empty-state{text-align:center;color:#888;padding:40px 20px}
.empty-state p{font-size:16px}
.success-message{background:#4CAF50;color:white;padding:12px 16px;border-radius:4px;margin-bottom:20px;display:none}
.error-message{background:#f44336;color:white;padding:12px 16px;border-radius:4px;margin-bottom:20px;display:none}
.password-strength{margin-top:8px;font-size:12px;padding:8px;border-radius:4px;display:none}
.password-strength.weak{background:#f44336;color:white;display:block}
.password-strength.medium{background:#ff9800;color:white;display:block}
.password-strength.strong{background:#4CAF50;color:white;display:block}
@media(max-width:768px){.content-wrapper{grid-template-columns:1fr}.form-section,.list-section{padding:20px}}
</style></head><body>
<div class="container">
<h1>Quản Lý User</h1>

<div class="content-wrapper">
<div class="form-section">
<h2>Tạo User Mới</h2>
<div id="successMessage" class="success-message">User được tạo thành công!</div>
<div id="errorMessage" class="error-message">Vui lòng điền đầy đủ thông tin!</div>
<form id="userForm">
<div class="form-group">
<label for="fullName">Họ và Tên</label>
<input type="text" id="fullName" name="fullName" placeholder="Nhập họ và tên" required>
</div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Nhập email" required>
</div>
<div class="form-group">
<label for="phone">Số Điện Thoại</label>
<input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
</div>
<div class="form-group">
<label for="role">Vai Trò</label>
<select id="role" name="role" required>
<option value="">-- Chọn vai trò --</option>
<option value="admin">Admin</option>
<option value="instructor">Giảng Viên</option>
<option value="student">Học Viên</option>
</select>
</div>
<div class="form-group">
<label for="status">Trạng Thái</label>
<select id="status" name="status" required>
<option value="">-- Chọn trạng thái --</option>
<option value="active">Hoạt Động</option>
<option value="inactive">Không Hoạt Động</option>
</select>
</div>
<div class="form-group password-group">
<label for="password">Mật Khẩu</label>
<input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
<button type="button" class="password-toggle" onclick="togglePasswordVisibility()">👁️</button>
<div id="passwordStrength" class="password-strength"></div>
</div>
<div class="form-group password-group">
<label for="confirmPassword">Xác Nhận Mật Khẩu</label>
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
<button type="button" class="password-toggle" onclick="toggleConfirmPasswordVisibility()">👁️</button>
</div>
<button type="submit" class="btn-submit">Tạo User</button>
</form>
</div>

<div class="list-section">
<h2>Danh Sách User</h2>
<div id="userList">
<div class="empty-state">
<p>Chưa có user nào. Hãy tạo user mới ở bên trái!</p>
</div>
</div>
</div>
</div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')) || [];

function togglePasswordVisibility() {
const passwordInput = document.getElementById('password');
const button = event.target;
if (passwordInput.type === 'password') {
passwordInput.type = 'text';
button.textContent = '🙈';
} else {
passwordInput.type = 'password';
button.textContent = '👁️';
}
}

function toggleConfirmPasswordVisibility() {
const confirmPasswordInput = document.getElementById('confirmPassword');
const button = event.target;
if (confirmPasswordInput.type === 'password') {
confirmPasswordInput.type = 'text';
button.textContent = '🙈';
} else {
confirmPasswordInput.type = 'password';
button.textContent = '👁️';
}
}

function checkPasswordStrength(password) {
const strengthDiv = document.getElementById('passwordStrength');
let strength = 0;

if (password.length >= 8) strength++;
if (password.length >= 12) strength++;
if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
if (/[0-9]/.test(password)) strength++;
if (/[^a-zA-Z0-9]/.test(password)) strength++;

strengthDiv.classList.remove('weak', 'medium', 'strong');

if (password.length === 0) {
strengthDiv.style.display = 'none';
} else if (strength <= 2) {
strengthDiv.classList.add('weak');
strengthDiv.textContent = '⚠️ Mật khẩu yếu - Tối thiểu 8 ký tự, chứa chữ hoa, chữ thường, số';
} else if (strength <= 3) {
strengthDiv.classList.add('medium');
strengthDiv.textContent = '⚡ Mật khẩu trung bình - Thêm ký tự đặc biệt để tăng độ bảo mật';
} else {
strengthDiv.classList.add('strong');
strengthDiv.textContent = '✓ Mật khẩu mạnh';
}
}

document.getElementById('password').addEventListener('input', function() {
checkPasswordStrength(this.value);
});

function renderUsers() {
const userList = document.getElementById('userList');
if (users.length === 0) {
userList.innerHTML = '<div class="empty-state"><p>Chưa có user nào. Hãy tạo user mới ở bên trái!</p></div>';
return;
}

let tableHTML = '<table class="user-table"><thead><tr><th>Họ và Tên</th><th>Email</th><th>Số ĐT</th><th>Vai Trò</th><th>Trạng Thái</th><th>Hành Động</th></tr></thead><tbody>';
users.forEach((user, index) => {
const statusClass = user.status === 'active' ? 'style="color:#4CAF50"' : 'style="color:#f44336"';
const statusText = user.status === 'active' ? 'Hoạt Động' : 'Không Hoạt Động';
tableHTML += `<tr>
<td>${user.fullName}</td>
<td>${user.email}</td>
<td>${user.phone}</td>
<td>${user.role === 'admin' ? 'Admin' : user.role === 'instructor' ? 'Giảng Viên' : 'Học Viên'}</td>
<td ${statusClass}>${statusText}</td>
<td>
<button class="action-btn btn-edit" onclick="editUser(${index})">Sửa</button>
<button class="action-btn btn-delete" onclick="deleteUser(${index})">Xóa</button>
<button class="action-btn btn-reset-password" onclick="resetPassword(${index})">Đặt Lại MK</button>
</td>
</tr>`;
});
tableHTML += '</tbody></table>';
userList.innerHTML = tableHTML;
}

function deleteUser(index) {
if (confirm('Bạn chắc chắn muốn xóa user này?')) {
users.splice(index, 1);
localStorage.setItem('users', JSON.stringify(users));
renderUsers();
}
}

function resetPassword(index) {
const newPassword = prompt('Nhập mật khẩu mới cho user này:');
if (newPassword !== null && newPassword.trim() !== '') {
if (newPassword.length < 8) {
alert('Mật khẩu phải có ít nhất 8 ký tự!');
return;
}
users[index].password = hashPassword(newPassword);
localStorage.setItem('users', JSON.stringify(users));
alert('Mật khẩu đã được đặt lại thành công!');
}
}

function editUser(index) {
const user = users[index];
document.getElementById('fullName').value = user.fullName;
document.getElementById('email').value = user.email;
document.getElementById('phone').value = user.phone;
document.getElementById('role').value = user.role;
document.getElementById('status').value = user.status;
document.getElementById('password').value = '';
document.getElementById('confirmPassword').value = '';
document.getElementById('passwordStrength').style.display = 'none';
users.splice(index, 1);
localStorage.setItem('users', JSON.stringify(users));
renderUsers();
document.querySelector('.form-section').scrollIntoView({behavior: 'smooth'});
}

function hashPassword(password) {
let hash = 0;
for (let i = 0; i < password.length; i++) {
const char = password.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash = hash & hash;
}
return 'hash_' + Math.abs(hash).toString(16);
}

document.getElementById('userForm').addEventListener('submit', function(e) {
e.preventDefault();
const fullName = document.getElementById('fullName').value.trim();
const email = document.getElementById('email').value.trim();
const phone = document.getElementById('phone').value.trim();
const role = document.getElementById('role').value;
const status = document.getElementById('status').value;
const password = document.getElementById('password').value;
const confirmPassword = document.getElementById('confirmPassword').value;

if (!fullName || !email || !phone || !role || !status || !password || !confirmPassword) {
document.getElementById('errorMessage').textContent = 'Vui lòng điền đầy đủ thông tin!';
document.getElementById('errorMessage').style.display = 'block';
setTimeout(() => {
document.getElementById('errorMessage').style.display = 'none';
}, 3000);
return;
}

if (password !== confirmPassword) {
document.getElementById('errorMessage').textContent = 'Mật khẩu xác nhận không khớp!';
document.getElementById('errorMessage').style.display = 'block';
setTimeout(() => {
document.getElementById('errorMessage').style.display = 'none';
}, 3000);
return;
}

if (password.length < 8) {
document.getElementById('errorMessage').textContent = 'Mật khẩu phải có ít nhất 8 ký tự!';
document.getElementById('errorMessage').style.display = 'block';
setTimeout(() => {
document.getElementById('errorMessage').style.display = 'none';
}, 3000);
return;
}

const hashedPassword = hashPassword(password);
users.push({fullName, email, phone, role, status, password: hashedPassword, createdAt: new Date().toISOString(), isActive: true});
localStorage.setItem('users', JSON.stringify(users));
document.getElementById('userForm').reset();
document.getElementById('passwordStrength').style.display = 'none';
document.getElementById('successMessage').style.display = 'block';
setTimeout(() => {
document.getElementById('successMessage').style.display = 'none';
}, 3000);
renderUsers();
});

renderUsers();
</script>
</body></html>
